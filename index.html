// ---------- storage ----------
// Records and products are namespaced per pet; the old un-namespaced keys are migrated once.
const KEY_PETS = "cat-diet-pets";
const KEY_PRODUCTS = "cat-diet-products";
const KEY_RECORDS = "cat-diet-records";
const KEY_PIN = "cat-diet-owner-pin";
const productsKey = (petId) => `${KEY_PRODUCTS}:${petId}`;
const recordsKey = (petId) => `${KEY_RECORDS}:${petId}`;
const vetViewedKey = (petId) => `cat-diet-vet-viewed:${petId}`;
// Medications are split into two lists, same pattern as products/records:
// medPresets = the reusable "regular meds" you set up once (name + usual dose/note);
// medLogs = one entry per actual dose given, tagged with a date and (if it came from a
// preset) the preset's id. Logs copy the name/dose text at the time they're created, so
// editing or deleting a preset later never rewrites history that's already been shown to
// a vet.
const medPresetsKey = (petId) => `cat-diet-med-presets:${petId}`;
const medLogsKey = (petId) => `cat-diet-med-logs:${petId}`;

// Reads a key. Returns [] when the key genuinely doesn't exist yet, but THROWS when the
// read itself fails (offline, quota, permissions). Callers must not treat a thrown error
// as "no data" — doing so previously caused a failed read to look like a first run and
// silently overwrite existing data with defaults.
async function loadKey(key) {
  const res = await window.storage.get(key, true);
  if (!res) return [];
  try {
    const parsed = JSON.parse(res.value);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return []; // stored value is corrupt, not a read failure
  }
}
async function saveKey(key, data) {
  try {
    await window.storage.set(key, JSON.stringify(data), true);
    return true;
  } catch (e) {
    console.error("storage save failed", e);
    return false;
  }
}
async function loadPin() {
  try {
    const res = await window.storage.get(KEY_PIN, true);
    return res ? res.value : "";
  } catch (e) {
    return "";
  }
}
async function savePin(pin) {
  try { await window.storage.set(KEY_PIN, pin, true); return true; } catch (e) { return false; }
}
async function clearPin() {
  try { await window.storage.delete(KEY_PIN, true); return true; } catch (e) { return false; }
}
// Records when someone taps into 醫師模式 for a given pet, so the owner has some signal
// that the link was opened. Not tied to any verified identity (no vet login exists) — it
// just means "someone opened the shared link and picked vet mode."
async function loadVetViewed(petId) {
  try {
    const res = await window.storage.get(vetViewedKey(petId), true);
    return res ? res.value : "";
  } catch (e) { return ""; }
}
async function saveVetViewed(petId) {
  try { await window.storage.set(vetViewedKey(petId), new Date().toISOString(), true); return true; } catch (e) { return false; }
}
function formatRelativeTime(iso) {
  if (!iso) return "";
  const then = new Date(iso).getTime();
  if (Number.isNaN(then)) return "";
  const min = Math.floor((Date.now() - then) / 60000);
  if (min < 1) return "剛剛";
  if (min < 60) return `${min} 分鐘前`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} 小時前`;
  const day = Math.floor(hr / 24);
  if (day < 7) return `${day} 天前`;
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

// Loads the pet list, creating a default pet (and moving any pre-multi-pet data into it) on
// first run. loadKey throws if the read fails, so this only reaches the "create default"
// branch when the list is confirmed empty — never because the network hiccuped.
async function loadPetsWithMigration() {
  let pets = await loadKey(KEY_PETS);
  if (Array.isArray(pets) && pets.length > 0) return pets;

  const legacyProducts = await loadKey(KEY_PRODUCTS);
  const legacyRecords = await loadKey(KEY_RECORDS);
  const pet = { id: "pet-1", name: "辛巴" };
  pets = [pet];
  await saveKey(KEY_PETS, pets);
  if (legacyProducts.length || legacyRecords.length) {
    await saveKey(productsKey(pet.id), legacyProducts);
    await saveKey(recordsKey(pet.id), legacyRecords);
  }
  return pets;
}

// Intake vs the product's daily target. Under 80% reads as "ate noticeably less".
function intakeStatus(total, target) {
  if (!target || target <= 0) return null;
  const pct = Math.round((total / target) * 100);
  const color = pct < 80 ? COLORS.danger : pct < 95 ? COLORS.gold : COLORS.accent;
  const label = pct < 80 ? "偏少" : pct > 115 ? "偏多" : "正常";
  return { pct, color, label, diff: total - target };
}


// ---------- Photo attachments ----------
// Photos live in their own storage keys (not inside the record) so the diary list stays small.
// Each is downscaled and re-encoded as JPEG before saving; Firestore caps a document at ~1MB.
const PHOTO_MAX_EDGE = 1280;
const PHOTO_QUALITY = 0.72;

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("讀取圖片失敗"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("圖片格式不支援"));
      img.onload = () => {
        const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", PHOTO_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const photoKey = (id) => `cat-diet-photo:${id}`;
// Module-level (not component state) so it survives PhotoThumb unmounting/remounting —
// e.g. switching tabs and coming back used to re-fetch every photo from Firestore from
// scratch, and if that refetch was slow or hiccupped, the thumbnail just sat on "載入中"
// forever with no way to tell it had actually failed. Caching means a photo that already
// loaded once stays visible instantly, no matter how many times you navigate away and back.
const photoCache = new Map();

async function savePhoto(dataUrl) {
  const id = uid();
  try {
    await window.storage.set(photoKey(id), dataUrl, true);
    photoCache.set(id, dataUrl);
    return id;
  } catch (e) {
    console.error("photo save failed", e);
    throw new Error("圖片儲存失敗，可能是檔案太大");
  }
}
async function loadPhoto(id) {
  if (photoCache.has(id)) return photoCache.get(id);
  try {
    const res = await window.storage.get(photoKey(id), true);
    const val = res ? res.value : null;
    if (val) photoCache.set(id, val);
    return val;
  } catch (e) {
    return null; // covers "not found" as well as a real read failure — PhotoThumb treats both as retry-able
  }
}
async function deletePhoto(id) {
  photoCache.delete(id);
  try { await window.storage.delete(photoKey(id), true); } catch (e) { /* already gone */ }
}

// Thumbnail that loads its image on demand, and opens full-screen when tapped
function PhotoThumb({ id, onRemove, size = 72 }) {
  const [src, setSrc] = useState(() => photoCache.get(id) || null);
  const [failed, setFailed] = useState(false);
  const [open, setOpen] = useState(false);
  const [retryTick, setRetryTick] = useState(0);
  useEffect(() => {
    const cached = photoCache.get(id);
    if (cached) { setSrc(cached); setFailed(false); return; }
    let alive = true;
    setFailed(false);
    loadPhoto(id).then((v) => {
      if (!alive) return;
      if (v) setSrc(v); else setFailed(true);
    });
    return () => { alive = false; };
  }, [id, retryTick]);

  return (
    <>
      <div style={{ position: "relative", flexShrink: 0 }}>
        <button
          onClick={() => (src ? setOpen(true) : failed && setRetryTick((t) => t + 1))}
          style={{
            width: size, height: size, borderRadius: 10, overflow: "hidden", padding: 0,
            border: `1px solid ${COLORS.line}`, background: "#F1EFEA", cursor: src ? "zoom-in" : failed ? "pointer" : "default",
          }}>
          {src
            ? <img src={src} alt="紀錄照片" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
            : failed
              ? <span style={{ fontSize: 10, color: COLORS.danger, padding: 4, textAlign: "center" }}>載入失敗<br />點一下重試</span>
              : <span style={{ fontSize: 10, color: COLORS.inkSoft }}>載入中</span>}
        </button>
        {onRemove && (
          <button onClick={() => onRemove(id)} aria-label="移除這張照片" style={{
            position: "absolute", top: -6, right: -6, width: 22, height: 22, borderRadius: 11,
            border: "none", background: COLORS.danger, color: "#fff", cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}><X size={13} /></button>
        )}
      </div>

      {open && (
        <div onClick={() => setOpen(false)} style={{
          position: "fixed", inset: 0, zIndex: 80, background: "rgba(20,26,24,0.92)",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 16, cursor: "zoom-out",
        }}>
          <img src={src} alt="紀錄照片（放大）" style={{ maxWidth: "100%", maxHeight: "100%", objectFit: "contain", borderRadius: 8 }} />
          <button onClick={() => setOpen(false)} aria-label="關閉" style={{
            position: "fixed", top: "calc(env(safe-area-inset-top, 0px) + 14px)", right: 14,
            width: 40, height: 40, borderRadius: 20, border: "none",
            background: "rgba(255,255,255,0.92)", color: COLORS.ink, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}><X size={22} /></button>
        </div>
      )}
    </>
  );
}

function Btn({ children, onClick, variant = "primary", size = "md", disabled, type = "button", style }) {
  const base = {
    fontFamily: "'IBM Plex Sans', sans-serif",
    fontWeight: 600,
    borderRadius: 10,
    border: "1px solid transparent",
    cursor: disabled ? "not-allowed" : "pointer",
    display: "inline-flex",
    alignItems: "center",
    justifyContent: "center",
    gap: 6,
    transition: "opacity .15s, transform .1s",
    opacity: disabled ? 0.5 : 1,
  };
  const sizes = { sm: { padding: "6px 12px", fontSize: 13 }, md: { padding: "10px 16px", fontSize: 14 } };
  const variants = {
    primary: { background: COLORS.accent, color: "#fff" },
    secondary: { background: COLORS.accentSoft, color: COLORS.accent },
    danger: { background: COLORS.dangerSoft, color: COLORS.danger },
    ghost: { background: "transparent", color: COLORS.inkSoft, border: `1px solid ${COLORS.line}` },
  };
  return (
    <button
      type={type}
      disabled={disabled}
      onClick={onClick}
      style={{ ...base, ...sizes[size], ...variants[variant], ...style }}
      onMouseDown={(e) => { e.currentTarget.style.transform = "scale(0.97)"; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = "scale(1)"; }}
    >
      {children}
    </button>
  );
}

}

function ScoreButtons({ value, onChange, min, max, labels, disabled, color }) {
  const nums = [];

  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
      {nums.map((n) => {
        const active = value === n;
        return (
          <button
            key={n}
            type="button"
            disabled={disabled}
            onClick={() => onChange(n)}
            title={labels && labels[n] ? labels[n] : undefined}
            style={{
              width: 36, height: 36, borderRadius: 9,
              border: `1px solid ${active ? color : COLORS.line}`,
              background: active ? color : "#fff",
              color: active ? "#fff" : COLORS.ink,
              fontWeight: 700, fontSize: 14, cursor: disabled ? "default" : "pointer",
            }}
          >
            {n}
          </button>
        );
      })}
    </div>
  );
}

function Field({ label, children, hint }) {

    <div style={{
      border: `1px solid ${COLORS.line}`, borderRadius: 12,
      padding: 6, background: "#fff",
      display: "flex", alignItems: "center", justifyContent: "center",
      minHeight: compact ? 90 : 140, overflow: "hidden",
    }}>
      <img
        src={BRISTOL_CHART_IMAGE}
        alt="Bristol Stool Scale 對照圖：Type 1 分離硬塊，Type 2 硬香腸狀，Type 3 表面有裂痕的香腸狀，Type 4 光滑柔軟的香腸/蛇狀，Type 5 邊緣清楚的軟塊，Type 6 邊緣不規則的鬆散糊狀，Type 7 完全液狀"
        style={{ maxWidth: "100%", maxHeight: compact ? 220 : 320, objectFit: "contain", borderRadius: 8 }}
      />
    </div>
  );
}

// ---------- Medications ----------
// A "preset" is a regular medication set up once (name + usual dose/note) so it can be
// tapped as a quick checkbox on any given day. A "log" is one actual dose given on one
// date — logs always copy the name/dose text at the time they're created, so editing or
// deleting a preset later never rewrites history that's already been shown to a vet. Ad
// hoc entries (something one-off, not worth saving as a preset) skip presets entirely —
// covers "the medication is different basically every time."
function MedSection({ date, medPresets, medLogs, role, onTogglePreset, onAddManual, onRemoveLog, onManagePresets }) {
  const dayLogs = medLogs.filter((l) => l.date === date);
  // Only ad hoc entries go in the list below — anything tied to a preset is already fully
  // represented by that preset's chip (checked = given), so listing it again there too was
  // showing the same medication twice for no reason.
  const manualLogs = dayLogs.filter((l) => l.presetId == null);
  const [manualOpen, setManualOpen] = useState(false);
  const [mName, setMName] = useState("");
  const [mDose, setMDose] = useState("");
  const [mNote, setMNote] = useState("");
  const [mSave, setMSave] = useState(false);

  const submitManual = () => {
    if (!mName.trim()) return;
    onAddManual({ name: mName.trim(), dose: mDose.trim(), note: mNote.trim(), saveAsPreset: mSave });
    setMName(""); setMDose(""); setMNote(""); setMSave(false); setManualOpen(false);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.ink }}>用藥</div>
        {role === "owner" && onManagePresets && (
          <button onClick={onManagePresets} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft, fontSize: 12, display: "flex", alignItems: "center", gap: 3 }}>
            <Pencil size={11} />常用藥
          </button>
        )}
      </div>

      {/* Every regular medication as a pill — checked = given today. Tappable for the
          owner (tap to log / un-log); shown the same way but non-interactive for the vet,
          so they can see the day's full regimen and what was/wasn't given without being
          able to edit anything. */}
      {medPresets.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {medPresets.map((p) => {
            const given = dayLogs.some((l) => l.presetId === p.id);
            const Tag = role === "owner" ? "button" : "div";
            return (
              <Tag key={p.id} onClick={role === "owner" ? () => onTogglePreset(p) : undefined} style={{
                display: "flex", alignItems: "center", gap: 5, padding: "6px 10px", borderRadius: 999,
                border: `1px solid ${given ? COLORS.accent : COLORS.line}`,
                background: given ? COLORS.accentSoft : "#fff",
                color: given ? COLORS.accent : COLORS.ink, fontSize: 12, fontWeight: 600,
                cursor: role === "owner" ? "pointer" : "default",
              }}>
                <span style={{
                  width: 14, height: 14, borderRadius: 4, flexShrink: 0,
                  border: `1.5px solid ${given ? COLORS.accent : COLORS.line}`,
                  background: given ? COLORS.accent : "transparent",
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}>{given && <Check size={10} color="#fff" strokeWidth={3} />}</span>
                {p.name}{p.dose ? ` · ${p.dose}` : ""}
              </Tag>
            );
          })}
        </div>
      )}

      {/* Ad hoc doses only — anything preset-based is already shown as a checked pill above */}
      {manualLogs.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {manualLogs.map((l) => (
            <div key={l.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: "#F1EFEA", borderRadius: 8, padding: "6px 10px" }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.ink }}>{l.name}{l.dose ? ` · ${l.dose}` : ""}</div>
                {l.note && <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 1 }}>{l.note}</div>}
              </div>
              {role === "owner" && onRemoveLog && (
                <button onClick={() => onRemoveLog(l.id)} aria-label="移除這筆用藥紀錄" style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft, flexShrink: 0 }}><X size={14} /></button>
              )}
            </div>
          ))}
        </div>
      )}

      {medPresets.length === 0 && manualLogs.length === 0 && role === "vet" && (
        <div style={{ fontSize: 12, color: COLORS.inkSoft }}>這天沒有用藥紀錄</div>
      )}

      {/* Ad hoc dose — for when this time's medication doesn't match anything preset */}
      {role === "owner" && (
        manualOpen ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 6, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 10 }}>
            <input value={mName} onChange={(e) => setMName(e.target.value)} placeholder="藥名（必填）" style={inputStyle} />
            <input value={mDose} onChange={(e) => setMDose(e.target.value)} placeholder="劑量／份量（選填，例：半顆、5mg）" style={inputStyle} />
            <input value={mNote} onChange={(e) => setMNote(e.target.value)} placeholder="備註（選填）" style={inputStyle} />
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: COLORS.inkSoft, cursor: "pointer" }}>
              <input type="checkbox" checked={mSave} onChange={(e) => setMSave(e.target.checked)} />
              加入常用藥，之後可以直接打勾
            </label>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <Btn variant="ghost" onClick={() => setManualOpen(false)}>取消</Btn>
              <Btn onClick={submitManual}><Check size={14} />新增</Btn>
            </div>
          </div>
        ) : (
          <button onClick={() => setManualOpen(true)} style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 12, fontWeight: 700, alignSelf: "flex-start", padding: 0 }}>
            <Plus size={13} />手動輸入這次的藥
          </button>
        )
      )}
    </div>
  );

}

// Small modal for adding/renaming/removing the reusable "常用藥" list
function MedPresetManager({ medPresets, onAdd, onRemove, onClose }) {
  const [name, setName] = useState("");
  const [dose, setDose] = useState("");
  const add = () => {
    if (!name.trim()) return;
    onAdd({ id: uid(), name: name.trim(), dose: dose.trim(), note: "" });
    setName(""); setDose("");
  };
  return (
    <Modal title="管理常用藥" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
        {medPresets.length === 0 && <div style={{ fontSize: 13, color: COLORS.inkSoft }}>還沒有常用藥，先加一個吧。</div>}
        {medPresets.map((p) => (
          <div key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: "#F1EFEA", borderRadius: 8, padding: "8px 10px" }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.ink }}>{p.name}{p.dose ? ` · ${p.dose}` : ""}</div>
            <button onClick={() => onRemove(p.id)} aria-label="移除常用藥" style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft, flexShrink: 0 }}><X size={14} /></button>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="藥名（必填）" style={inputStyle} />
        <input value={dose} onChange={(e) => setDose(e.target.value)} placeholder="常用劑量（選填）" style={inputStyle} />
        <Btn onClick={add} style={{ alignSelf: "flex-end" }}><Plus size={14} />新增常用藥</Btn>
      </div>
    </Modal>
  );
}

  const add = () => {

    onAddPreset({ id: uid(), name: name.trim(), dose: dose.trim(), note: "" });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card>
        <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.ink, marginBottom: 10 }}>常用藥</div>
        {medPresets.length === 0 ? (
          <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: role === "owner" ? 12 : 0 }}>還沒有常用藥。</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: role === "owner" ? 14 : 0 }}>
            {medPresets.map((p) => (
              <div key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: "#F1EFEA", borderRadius: 10, padding: "10px 12px" }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.ink }}>{p.name}{p.dose ? ` · ${p.dose}` : ""}</div>
                {role === "owner" && onRemovePreset && (
                  <button onClick={() => onRemovePreset(p.id)} aria-label="移除常用藥" style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft }}><X size={15} /></button>
                )}
              </div>
            ))}
          </div>
        )}
        {role === "owner" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="藥名（必填）" style={inputStyle} />
            <input value={dose} onChange={(e) => setDose(e.target.value)} placeholder="常用劑量（選填）" style={inputStyle} />
            <Btn onClick={add} style={{ alignSelf: "flex-end" }}><Plus size={14} />新增常用藥</Btn>
          </div>
        )}
      </Card>

      <Card>
        <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.ink, marginBottom: 10 }}>用藥紀錄</div>
        {sortedLogs.length === 0 ? (
          <div style={{ fontSize: 13, color: COLORS.inkSoft }}>還沒有任何用藥紀錄。</div>
        ) : (

                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 11, color: COLORS.inkSoft }}>{l.date}</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.ink }}>{l.name}{l.dose ? ` · ${l.dose}` : ""}</div>
                  {l.note && <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 1 }}>{l.note}</div>}
                </div>
                {role === "owner" && onRemoveLog && (
                  <button onClick={() => onRemoveLog(l.id)} aria-label="移除這筆用藥紀錄" style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft, flexShrink: 0 }}><X size={14} /></button>

            ))}

    </div>

// Picks the sensible default food for a given date: the one actually in use then
// (startDate reached, not yet ended). products[0] used to win, which is the oldest food
// ever added — so a new record kept defaulting to a feed that was long since replaced.
// Falls back to the most recently started product if the date matches no active period.
function defaultProductForDate(products, date) {
  if (!products.length) return "";
  const byNewest = [...products].sort((a, b) => (b.startDate || "").localeCompare(a.startDate || ""));
  const active = byNewest.find((p) => (!p.startDate || p.startDate <= date) && (!p.endDate || p.endDate >= date));
  return (active || byNewest[0]).id;
}

// ---------- Record Form (used for add / edit) ----------
function RecordForm({ initial, products, existingDates, onSave, onCancel, onDelete, onQuickAddProduct, renderActions, medPresets = [], medLogs = [], onSetDayMeds, onAddManualMed, onRemoveMedLog, onManageMedPresets }) {
  const [date, setDate] = useState(initial?.date || todayStr());
  const [productId, setProductId] = useState(initial?.productId || defaultProductForDate(products, initial?.date || todayStr()));
  // Once the food is picked by hand, changing the date must not silently re-pick it.
  const productTouched = useRef(!!initial?.productId);
  const [breakfast, setBreakfast] = useState(initial?.breakfast ?? 0);
  const [dinner, setDinner] = useState(initial?.dinner ?? 0);
  const [bedtime, setBedtime] = useState(initial?.bedtime ?? 0);
  const [mental, setMental] = useState(initial?.mental ?? 3);
  const [stool, setStool] = useState(initial?.stool ?? 4);
  const [vomit, setVomit] = useState(initial?.vomit ?? 0);
  const [other, setOther] = useState(initial?.other || "");
  const [photos, setPhotos] = useState(initial?.photos || []);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [stress, setStress] = useState(initial?.stress || "");
  const [error, setError] = useState("");
  const [addingProduct, setAddingProduct] = useState(false);
  const [newProductName, setNewProductName] = useState("");
  const [medManualOpen, setMedManualOpen] = useState(false);
  const [mName, setMName] = useState("");
  const [mDose, setMDose] = useState("");
  const [mNote, setMNote] = useState("");
  const [mSave, setMSave] = useState(false);

  // Keep the default food in step with the date while it's still the default — so
  // backfilling an older day picks whatever was being fed then, not today's food.
  useEffect(() => {
    if (productTouched.current) return;
    const next = defaultProductForDate(products, date);
    if (next && next !== productId) setProductId(next);
  }, [date, products]); // eslint-disable-line

  const total = (Number(breakfast) || 0) + (Number(dinner) || 0) + (Number(bedtime) || 0);

  const handleSave = () => {
    if (!date) { setError("請選擇日期"); return; }
    if (!initial && existingDates.includes(date)) {
      setError("這一天已經有紀錄了，請改用「飲食日記」修改該筆資料。");
      return;
    }
    if (!productId) { setError("請選擇當天食用的產品，或用上面的「＋ 新增產品」直接建立一個。"); return; }
    onSave({
      id: initial?.id || uid(),
      date, productId,
      breakfast: Math.max(0, Number(breakfast) || 0),
      dinner: Math.max(0, Number(dinner) || 0),
      bedtime: Math.max(0, Number(bedtime) || 0),
      mental: Number(mental), stool: Number(stool), vomit: Number(vomit),
      other, stress, photos,
    });
  };

  const actions = (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
      <div>
        {initial && onDelete && (
          <Btn variant="danger" onClick={() => onDelete(initial.id)}><Trash2 size={15} />刪除</Btn>
        )}
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <Btn variant="ghost" onClick={onCancel}>取消</Btn>
        <Btn onClick={handleSave}><Check size={15} />儲存</Btn>
      </div>
    </div>
  );
  // Hand the action row to a parent (so a Modal can pin it) without setting parent state on
  // every render: publish a stable element that reads the latest handlers through a ref.
  const latest = useRef({ handleSave, onCancel, onDelete, initial });
  latest.current = { handleSave, onCancel, onDelete, initial };
  useEffect(() => {
    if (!renderActions) return;
    renderActions(
      <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
        <div>
          {latest.current.initial && latest.current.onDelete && (
            <Btn variant="danger" onClick={() => latest.current.onDelete(latest.current.initial.id)}><Trash2 size={15} />刪除</Btn>
          )}
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <Btn variant="ghost" onClick={() => latest.current.onCancel()}>取消</Btn>
          <Btn onClick={() => latest.current.handleSave()}><Check size={15} />儲存</Btn>
        </div>
      </div>
    );
    return () => renderActions(null);
  }, [renderActions]);

  return (
    <div>
      {error && (
        <div style={{
          display: "flex", gap: 8, alignItems: "flex-start", background: COLORS.dangerSoft,
          color: COLORS.danger, padding: "10px 12px", borderRadius: 10, fontSize: 13, marginBottom: 14,
        }}>
          <AlertCircle size={16} style={{ flexShrink: 0, marginTop: 1 }} />
          <span>{error}</span>
        </div>
      )}
      <Field label="日期">
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} disabled={!!initial} />
      </Field>
      <Field label="食用產品">
        <select value={productId} onChange={(e) => {
          if (e.target.value === "__new__") { setAddingProduct(true); }
          else { productTouched.current = true; setProductId(e.target.value); }
        }} style={inputStyle}>
          {products.length === 0 && <option value="">尚無產品</option>}
          {products.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
          {onQuickAddProduct && <option value="__new__">＋ 新增產品...</option>}
        </select>
        {addingProduct && (
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <input value={newProductName} onChange={(e) => setNewProductName(e.target.value)} style={inputStyle} placeholder="新產品名稱，例如：GI32" autoFocus />
            <Btn size="sm" onClick={() => {
              if (!newProductName.trim()) return;
              const prod = onQuickAddProduct(newProductName, date);
              productTouched.current = true;
              setProductId(prod.id);
              setNewProductName("");
              setAddingProduct(false);
            }}>新增</Btn>
            <Btn size="sm" variant="ghost" onClick={() => { setAddingProduct(false); setNewProductName(""); }}>取消</Btn>
          </div>
        )}
      </Field>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
        <Field label="早餐 (g)"><input type="number" min="0" value={breakfast} onChange={(e) => setBreakfast(e.target.value)} style={inputStyle} /></Field>
        <Field label="晚餐 (g)"><input type="number" min="0" value={dinner} onChange={(e) => setDinner(e.target.value)} style={inputStyle} /></Field>
        <Field label="睡前 (g)"><input type="number" min="0" value={bedtime} onChange={(e) => setBedtime(e.target.value)} style={inputStyle} /></Field>
      </div>

      {(() => {
        const target = products.find((p) => p.id === productId)?.dailyTarget;
        const st = intakeStatus(total, target);
        return (
          <div style={{ background: COLORS.accentSoft, borderRadius: 10, padding: "10px 14px", marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: COLORS.accent }}>每日總量（自動計算）</span>
              <span style={{ fontSize: 18, fontWeight: 700, color: COLORS.accent }}>{total} g</span>
            </div>
            {st && (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6, fontSize: 12 }}>
                <span style={{ color: COLORS.inkSoft }}>建議 {target} g</span>
                <span style={{ color: st.color, fontWeight: 700 }}>
                  {st.pct}%・{st.diff >= 0 ? "+" : ""}{st.diff} g（{st.label}）
                </span>
              </div>
            )}
          </div>
        );
      })()}

      <Field label="精神分數 (0～5)">
        <ScoreButtons value={Number(mental)} onChange={setMental} min={0} max={5} color={COLORS.accent} />
      </Field>

      <Field label="便便分數 — Bristol Stool Scale (1～7)">
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-start" }}>
          <ScoreButtons value={Number(stool)} onChange={setStool} min={1} max={7} color={COLORS.gold} />
          <div style={{ flex: "1 1 160px", minWidth: 140 }}><BristolPlaceholder compact /></div>
        </div>
      </Field>

      <Field label="嘔吐次數 (0～5)">
        <ScoreButtons value={Number(vomit)} onChange={setVomit} min={0} max={5} color={COLORS.danger} />
      </Field>

      <Field label="壓力事件">
        <textarea value={stress} onChange={(e) => setStress(e.target.value)} rows={3}
          style={{ ...inputStyle, resize: "vertical", minHeight: 84 }} placeholder="例如：搬家、有客人來訪、打雷..." />
      </Field>
      <Field label="其他備註">
        <textarea value={other} onChange={(e) => setOther(e.target.value)} rows={5}
          style={{ ...inputStyle, resize: "vertical", minHeight: 140 }} placeholder="今天的觀察、餵食方式、偷吃了什麼..." />
      </Field>

      {onSetDayMeds && (() => {
        const dayLogs = medLogs.filter((l) => l.date === date);
        const manualLogs = dayLogs.filter((l) => l.presetId == null);
        const selectedIds = medPresets.filter((p) => dayLogs.some((l) => l.presetId === p.id)).map((p) => p.id);
        return (
          <Field label="用藥">
            {medPresets.length > 0 ? (
              <select multiple value={selectedIds}
                onChange={(e) => onSetDayMeds(date, Array.from(e.target.selectedOptions).map((o) => o.value))}
                size={Math.min(6, medPresets.length)}
                style={{ ...inputStyle, padding: 0 }}
              >
                {medPresets.map((p) => (
                  <option key={p.id} value={p.id} style={{ padding: "8px 10px" }}>
                    {p.name}{p.dose ? ` · ${p.dose}` : ""}
                  </option>
                ))}
              </select>
            ) : (
              <div style={{ fontSize: 12, color: COLORS.inkSoft }}>還沒有常用藥，可以先到「用藥清單」新增，之後就能在這裡直接選。</div>
            )}
            {onManageMedPresets && (
              <button type="button" onClick={onManageMedPresets} style={{ marginTop: 6, background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 12, fontWeight: 600, padding: 0 }}>
                管理常用藥
              </button>
            )}

            {manualLogs.length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
                {manualLogs.map((l) => (
                  <div key={l.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: "#F1EFEA", borderRadius: 8, padding: "6px 10px" }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.ink }}>{l.name}{l.dose ? ` · ${l.dose}` : ""}</div>
                      {l.note && <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 1 }}>{l.note}</div>}
                    </div>
                    {onRemoveMedLog && (
                      <button type="button" onClick={() => onRemoveMedLog(l.id)} aria-label="移除這筆用藥紀錄" style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft, flexShrink: 0 }}><X size={14} /></button>
                    )}
                  </div>
                ))}
              </div>
            )}

            {onAddManualMed && (
              medManualOpen ? (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 10, marginTop: 8 }}>
                  <input value={mName} onChange={(e) => setMName(e.target.value)} placeholder="藥名（必填）" style={inputStyle} />
                  <input value={mDose} onChange={(e) => setMDose(e.target.value)} placeholder="劑量／份量（選填，例：半顆、5mg）" style={inputStyle} />
                  <input value={mNote} onChange={(e) => setMNote(e.target.value)} placeholder="備註（選填）" style={inputStyle} />
                  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: COLORS.inkSoft, cursor: "pointer" }}>
                    <input type="checkbox" checked={mSave} onChange={(e) => setMSave(e.target.checked)} />
                    加入常用藥，之後可以直接選
                  </label>
                  <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                    <Btn variant="ghost" onClick={() => setMedManualOpen(false)}>取消</Btn>
                    <Btn onClick={() => {
                      if (!mName.trim()) return;
                      onAddManualMed(date, { name: mName.trim(), dose: mDose.trim(), note: mNote.trim(), saveAsPreset: mSave });
                      setMName(""); setMDose(""); setMNote(""); setMSave(false); setMedManualOpen(false);
                    }}><Check size={14} />新增</Btn>
                  </div>
                </div>
              ) : (
                <button type="button" onClick={() => setMedManualOpen(true)} style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 12, fontWeight: 700, marginTop: 8, padding: 0 }}>
                  <Plus size={13} />手動輸入這次的藥
                </button>
              )
            )}
          </Field>
        );
      })()}

      <Field label="照片（嘔吐物、便便等，可不加）">
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          {photos.map((pid) => (
            <PhotoThumb key={pid} id={pid} onRemove={(id) => {
              setPhotos((ps) => ps.filter((x) => x !== id));
              deletePhoto(id);
            }} />
          ))}
          <label style={{
            width: 72, height: 72, borderRadius: 10, border: `1.5px dashed ${COLORS.line}`,
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
            gap: 2, cursor: photoBusy ? "wait" : "pointer", color: COLORS.inkSoft, fontSize: 11, flexShrink: 0,
          }}>
            <Plus size={18} />
            {photoBusy ? "處理中" : "加照片"}
            <input type="file" accept="image/*" style={{ display: "none" }} disabled={photoBusy}
              onChange={async (e) => {
                const files = Array.from(e.target.files || []);
                e.target.value = "";
                if (files.length === 0) return;
                setPhotoBusy(true);
                setError("");
                try {
                  for (const f of files) {
                    const dataUrl = await compressImage(f);
                    const id = await savePhoto(dataUrl);
                    setPhotos((ps) => [...ps, id]);
                  }
                } catch (err) {
                  setError(err.message || "照片上傳失敗");
                } finally {
                  setPhotoBusy(false);
                }
              }} />
          </label>
        </div>
      </Field>

      {/* When a Modal pins these, it calls renderActions instead of showing them inline */}
      {!renderActions && actions}
    </div>
  );
}

// ---------- Product Form ----------
function ProductForm({ initial, onSave, onCancel, onDelete }) {
  const [name, setName] = useState(initial?.name || "");
  const [startDate, setStartDate] = useState(initial?.startDate || todayStr());
  const [endDate, setEndDate] = useState(initial?.endDate || "");
  const [color, setColor] = useState(initial?.color || PALETTE[0].key);
  const [target, setTarget] = useState(initial?.dailyTarget ?? "");
  const [error, setError] = useState("");

  const handleSave = () => {
    if (!name.trim()) { setError("請輸入產品名稱"); return; }
    if (!startDate) { setError("請選擇開始使用日期"); return; }
    if (endDate && endDate < startDate) { setError("結束日期不能早於開始日期"); return; }
    const t = Number(target);
    onSave({
      id: initial?.id || uid(), name: name.trim(), startDate, endDate: endDate || null, color,
      dailyTarget: target === "" || !(t > 0) ? null : Math.round(t),
    });
  };

  return (
    <div>
      {error && (
        <div style={{ background: COLORS.dangerSoft, color: COLORS.danger, padding: "10px 12px", borderRadius: 10, fontSize: 13, marginBottom: 14 }}>
          {error}
        </div>
      )}
      <Field label="產品名稱"><input value={name} onChange={(e) => setName(e.target.value)} style={inputStyle} placeholder="例如：GI32" /></Field>
      <Field label="每日建議量 (g)" hint="醫師或包裝建議的每日份量。體重改變後回來改這裡即可，可留空。">
        <input type="number" min="0" inputMode="numeric" value={target} onChange={(e) => setTarget(e.target.value)}
          style={inputStyle} placeholder="例如：60" />
      </Field>
      <Field label="開始使用日期"><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} style={inputStyle} /></Field>
      <Field label="結束使用日期" hint="可留空，表示目前仍在使用"><input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} style={inputStyle} /></Field>
      <Field label="圖表背景顏色">
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {PALETTE.map((p) => (
            <button key={p.key} type="button" onClick={() => setColor(p.key)}
              style={{
                width: 34, height: 34, borderRadius: 9, background: p.bg,
                border: `2px solid ${color === p.key ? p.border : "transparent"}`,
                boxShadow: color === p.key ? `0 0 0 1px ${p.border}` : "none", cursor: "pointer",
              }} />
          ))}
        </div>
      </Field>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18, gap: 10 }}>
        <div>{initial && onDelete && <Btn variant="danger" onClick={() => onDelete(initial.id)}><Trash2 size={15} />刪除</Btn>}</div>
        <div style={{ display: "flex", gap: 10 }}>
          <Btn variant="ghost" onClick={onCancel}>取消</Btn>
          <Btn onClick={handleSave}><Check size={15} />儲存</Btn>
        </div>
      </div>

// ---------- Modal ----------
// Full-screen sheet with a fixed header: on a phone the record form is long, so a small
// floating box meant the close button scrolled away and the page behind kept moving.
function Modal({ title, onClose, children, width = 560, footer }) {
  // Close on the hardware/gesture back action so it behaves like a real page
  useEffect(() => {
    window.history.pushState({ modal: true }, "");
    const onPop = () => onClose();
    window.addEventListener("popstate", onPop);
    return () => {
      window.removeEventListener("popstate", onPop);
      if (window.history.state && window.history.state.modal) window.history.back();
    };
  }, []); // eslint-disable-line

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(38,51,46,0.45)", zIndex: 50,
      display: "flex", alignItems: "center", justifyContent: "center", padding: "0",
    }} onClick={onClose} className="modal-backdrop">
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: COLORS.bg, width: "100%", maxWidth: width,
          height: "100dvh", display: "flex", flexDirection: "column",
          boxShadow: "0 -6px 30px rgba(0,0,0,0.2)",
        }}
        className="modal-sheet"
      >
        <div style={{
          display: "flex", alignItems: "center", gap: 8, flexShrink: 0,
          padding: "12px 16px", paddingTop: "calc(env(safe-area-inset-top, 0px) + 14px)",
          borderBottom: `1px solid ${COLORS.line}`, background: COLORS.bg,
        }}>
          <button onClick={onClose} style={{
            display: "flex", alignItems: "center", gap: 2, background: "none", border: "none",
            cursor: "pointer", color: COLORS.accent, fontSize: 14, fontWeight: 600, padding: 0, flexShrink: 0,
          }}><ChevronLeft size={18} />返回</button>
          <h3 style={{
            margin: 0, flex: 1, textAlign: "center", fontFamily: "'Source Serif 4', serif",
            fontSize: 17, color: COLORS.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
          }}>{title}</h3>
          <div style={{ width: 52, flexShrink: 0 }} />
        </div>

        <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch", padding: 16, paddingBottom: 24 }}>
          {children}
        </div>

        {footer && (
          <div style={{
            flexShrink: 0, borderTop: `1px solid ${COLORS.line}`, background: COLORS.bg,
            padding: "12px 16px", paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 12px)",
          }}>{footer}</div>
        )}
      </div>
    </div>
  );
}

// Single-day version of the hub's period score: same idea (start at 100, deduct for
// what's off), but scored against just this one record instead of a whole product period.
// Kept separate from HealthSummary/hub scoring on purpose — the hub's period score stays
// exactly as-is; this only feeds the per-day badge on the day detail page.
function dayRating(record, product) {
  const ti = targetInfo(record, product ? [product] : []);
  const flags = flagsForRecord(record);
  let score = 100;
  if (ti) score -= ti.pct < 70 ? 30 : ti.pct < 90 ? 15 : ti.pct > 130 ? 12 : 0;
  score -= Math.min(30, flags.length * 15); // each flag = vomit, low mood, or abnormal stool
  if (record.mental === 3) score -= 8; // not flagged, but "just okay" still counts a little
  score = Math.max(0, Math.min(100, score));
  return score >= 80
    ? { score, color: COLORS.accent, word: "今天狀況不錯", mood: 5 }
    : score >= 55
      ? { score, color: COLORS.gold, word: "還可以，留意一下", mood: 3 }
      : { score, color: COLORS.danger, word: "今天需要注意", mood: 1 };
}

// ---------- Daily target helpers ----------
// A day is judged against its own product's suggested grams; no target => no judgement.
function targetInfo(record, products) {
  const target = products.find((p) => p.id === record.productId)?.dailyTarget;
  if (!target) return null;
  const total = record.breakfast + record.dinner + record.bedtime;
  const pct = Math.round((total / target) * 100);
  const color = pct < 70 ? COLORS.danger : pct < 90 ? COLORS.gold : pct > 130 ? COLORS.gold : COLORS.accent;
  const label = pct < 70 ? "明顯偏少" : pct < 90 ? "略偏少" : pct > 130 ? "偏多" : "達標";
  return { target, total, pct, color, label };
}

function DayPanelBody({ record, product, role, products, existingDates, onSave, onDelete, onOpenInHistory, onQuickAddProduct, onPrevDay, onNextDay, prevDate, nextDate, medPresets = [], medLogs = [], onSetDayMeds, onAddManualMed, onRemoveMedLog, onManageMedPresets }) {
  const [editing, setEditing] = useState(false);
  const touch = useRef(null);
  if (!record) return null;

  // Horizontal swipe steps to the previous / next recorded day (only while viewing, not editing)
  const swipeHandlers = (onPrevDay || onNextDay) && !editing ? {
    onTouchStart: (e) => { touch.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; },
    onTouchEnd: (e) => {
      if (!touch.current) return;
      const dx = e.changedTouches[0].clientX - touch.current.x;
      const dy = e.changedTouches[0].clientY - touch.current.y;
      touch.current = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // ignore vertical scrolls
      if (dx > 0 && onPrevDay) onPrevDay();
      if (dx < 0 && onNextDay) onNextDay();
    },
  } : {};

  if (editing && role === "owner") {
    return (
      <RecordForm
        key={record.date}

    <div {...swipeHandlers}>

      {(onPrevDay || onNextDay) && (() => {

              boxShadow: onPrevDay ? "0 1px 4px rgba(38,51,46,0.12)" : "none",

            <div style={{ textAlign: "center", lineHeight: 1.25 }}>
