// as "no data" — doing so previously caused a failed read to look like a first run and
// silently overwrite existing data with defaults.
async function loadKey(key) {
    const res = await window.storage.get(key, true);
    let remote = [];
    if (res) {
        try {
            const parsed = JSON.parse(res.value);
            remote = Array.isArray(parsed) ? parsed : [];
        }
        catch (e) {
            remote = []; // stored value is corrupt, not a read failure
        }
    }
    // If a previous save never made it to the server, the on-device backup holds data the
    // server doesn't. Prefer it, and push it back up so the two match again.
    const backup = readLocalBackup(key);
    if (backup && backup.data.length > remote.length) {
        console.warn("recovering unsaved data from local backup:", key);
        saveKey(key, backup.data); // fire-and-forget; re-marks pending if it fails again
        return backup.data;

// synchronous and on-device, so it survives a dead connection, a closed tab, and a reload.

            pendingWrites.delete(key);

function formatRelativeTime(iso) {
    if (!iso)
        return "";
    const then = new Date(iso).getTime();
    if (Number.isNaN(then))
        return "";
    const min = Math.floor((Date.now() - then) / 60000);
    if (min < 1)
        return "剛剛";
    if (min < 60)
        return `${min} 分鐘前`;
    const hr = Math.floor(min / 60);
    if (hr < 24)
        return `${hr} 小時前`;
    const day = Math.floor(hr / 24);
    if (day < 7)
        return `${day} 天前`;

    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
