// ---------- Main App ----------
function App() {
  const [screen, setScreen] = useState("landing"); // 'landing' | 'pets' | 'app'
  const [role, setRole] = useState("owner"); // 'owner' | 'vet'
  const [tab, setTab] = useState(null); // null = layer-2 hub menu; a key = layer-3 section detail
  const [pets, setPets] = useState([]);
  const [petId, setPetId] = useState(null);
  const [products, setProducts] = useState([]);
  const [records, setRecords] = useState([]);
  const [medPresets, setMedPresets] = useState([]);
  const [medLogs, setMedLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null); // {type:'addProduct'|'editProduct'|'dayPanel', payload}
  const [ownerPin, setOwnerPin] = useState(""); // "" = no PIN protection set
  const [pinPrompt, setPinPrompt] = useState(false); // true while entering PIN to unlock owner mode
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState("");
  const [pinSettingsOpen, setPinSettingsOpen] = useState(false);
  const [confirmDialog, setConfirmDialog] = useState(null); // { message, onYes } — replaces window.confirm, which the sandbox can silently block
  const [petModal, setPetModal] = useState(null); // { mode:'add'|'edit', pet }
  const [vetViewedAt, setVetViewedAt] = useState(""); // ISO timestamp string, "" = never (for this pet)
  const [medPresetsOpen, setMedPresetsOpen] = useState(false);

  const [loadError, setLoadError] = useState("");

  useEffect(() => {
    (async () => { setOwnerPin(await loadPin()); })();
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const list = await loadPetsWithMigration();
        setPets(list);
        setLoadError("");
      } catch (e) {
        console.error("pet list load failed", e);
        // Surface the failure instead of falling through with an empty list — an empty
        // list here would look like "no pets" and invite writes that overwrite real data.
        setLoadError("資料載入失敗，可能是網路不穩。請重新整理再試一次。");
      }
      setLoading(false);
    })();
  }, []);

  // Each pet keeps its own records and products, so switching pets reloads that pet's data
  const [petLoading, setPetLoading] = useState(false);
  useEffect(() => {
    if (!petId) { setProducts([]); setRecords([]); setMedPresets([]); setMedLogs([]); return; }
    let cancelled = false;
    setPetLoading(true);
    (async () => {
      try {
        const [p, r, mp, ml] = await Promise.all([
          loadKey(productsKey(petId)), loadKey(recordsKey(petId)),
          loadKey(medPresetsKey(petId)), loadKey(medLogsKey(petId)),
        ]);
        if (!cancelled) { setProducts(p); setRecords(r); setMedPresets(mp); setMedLogs(ml); setLoadError(""); }
      } catch (e) {
        console.error("pet data load failed", e);
        // Leave whatever is already in state alone; blanking it would make the UI look
        // empty and any subsequent save would persist that emptiness over good data.
        if (!cancelled) setLoadError("這隻寵物的資料載入失敗，請重新整理再試一次。先不要新增或修改，以免覆蓋原本的紀錄。");
      }
      if (!cancelled) setPetLoading(false);
    })();
    return () => { cancelled = true; };
  }, [petId]);

  // Load the "vet last viewed" timestamp whenever the selected pet changes, so the owner
  // can see it on the hub. Separately, if *this* session just entered vet mode, log a
  // fresh timestamp — see loadVetViewed/saveVetViewed for what this can and can't prove.
  useEffect(() => {
    if (!petId) { setVetViewedAt(""); return; }
    (async () => { setVetViewedAt(await loadVetViewed(petId)); })();
  }, [petId]);
  useEffect(() => {
    if (role === "vet" && petId) {
      saveVetViewed(petId).then(() => setVetViewedAt(new Date().toISOString()));
    }
  }, [role, petId]);

  const persistPets = useCallback(async (next) => { setPets(next); await saveKey(KEY_PETS, next); }, []);
  const persistRecords = useCallback(async (next) => { setRecords(next); if (petId) await saveKey(recordsKey(petId), next); }, [petId]);
  const persistProducts = useCallback(async (next) => { setProducts(next); if (petId) await saveKey(productsKey(petId), next); }, [petId]);
  const persistMedPresets = useCallback(async (next) => { setMedPresets(next); if (petId) await saveKey(medPresetsKey(petId), next); }, [petId]);
  const persistMedLogs = useCallback(async (next) => { setMedLogs(next); if (petId) await saveKey(medLogsKey(petId), next); }, [petId]);

  // Tapping a preset for a given date: if it's already logged that day, un-log it (undo a
  // mis-tap); otherwise add a log entry copying the preset's current name/dose/note.
  const toggleMedPreset = (date, preset) => {
    const existing = medLogs.find((l) => l.date === date && l.presetId === preset.id);
    if (existing) { persistMedLogs(medLogs.filter((l) => l.id !== existing.id)); return; }
    persistMedLogs([...medLogs, { id: uid(), date, presetId: preset.id, name: preset.name, dose: preset.dose || "", note: preset.note || "" }]);
  };
  // One-off / ad hoc dose that isn't (or isn't yet) a saved preset. saveAsPreset also adds
  // it to the regular list so it's a tappable checkbox next time.
  const addManualMedLog = (date, { name, dose, note, saveAsPreset }) => {
    const entry = { id: uid(), date, presetId: null, name, dose: dose || "", note: note || "" };
    persistMedLogs([...medLogs, entry]);
    if (saveAsPreset) persistMedPresets([...medPresets, { id: uid(), name, dose: dose || "", note: note || "" }]);
  };
  const removeMedLog = (id) => persistMedLogs(medLogs.filter((l) => l.id !== id));
  // Multi-select "which presets applied today" from one dropdown — computes the whole
  // diff and writes once. (Calling toggleMedPreset in a loop for each change would race:
  // every call in the same synchronous handler reads the same stale medLogs snapshot, so
  // only the last toggle in the batch would actually stick.)
  const setDayMedPresets = (date, presetIds) => {
    const idSet = new Set(presetIds);
    const keep = medLogs.filter((l) => l.date !== date || l.presetId == null || idSet.has(l.presetId));
    const already = new Set(keep.filter((l) => l.date === date && l.presetId != null).map((l) => l.presetId));
    const toAdd = medPresets
      .filter((p) => idSet.has(p.id) && !already.has(p.id))
      .map((p) => ({ id: uid(), date, presetId: p.id, name: p.name, dose: p.dose || "", note: p.note || "" }));
    persistMedLogs([...keep, ...toAdd]);
  };


  const currentPet = pets.find((p) => p.id === petId) || null;
  const savePet = async (pet) => {
    const exists = pets.some((p) => p.id === pet.id);
    await persistPets(exists ? pets.map((p) => (p.id === pet.id ? pet : p)) : [...pets, pet]);
    setPetModal(null);
  };
  const deletePet = async (id) => {
    if (pets.length <= 1) return; // always keep at least one pet
    await persistPets(pets.filter((p) => p.id !== id));
    try { await window.storage.delete(productsKey(id), true); } catch (e) { /* noop */ }
    try { await window.storage.delete(recordsKey(id), true); } catch (e) { /* noop */ }
    try { await window.storage.delete(medPresetsKey(id), true); } catch (e) { /* noop */ }
    try { await window.storage.delete(medLogsKey(id), true); } catch (e) { /* noop */ }
    if (petId === id) { setPetId(null); setScreen("pets"); }
    setPetModal(null);
  };
  // After picking a role: go straight in if there's only one pet, otherwise ask which pet
  const enterAs = (r) => {
    setRole(r); setTab(null);
    if (pets.length === 1) { setPetId(pets[0].id); setScreen("app"); }
    else { setScreen("pets"); }
  };
  const choosePet = (id) => { setPetId(id); setTab(null); setScreen("app"); };

  const saveRecord = (rec) => {
    const exists = records.some((r) => r.id === rec.id);
    const next = exists ? records.map((r) => (r.id === rec.id ? rec : r)) : [...records, rec];
    persistRecords(next);
    setModal(null);
  };
  const deleteRecord = (id) => { persistRecords(records.filter((r) => r.id !== id)); setModal(null); };
  const saveProduct = (prod) => {
    const exists = products.some((p) => p.id === prod.id);
    const next = exists ? products.map((p) => (p.id === prod.id ? prod : p)) : [...products, prod];
    persistProducts(next);
    setModal(null);
  };
  const deleteProduct = (id) => { persistProducts(products.filter((p) => p.id !== id)); setModal(null); };
  const deleteRecords = (ids) => { persistRecords(records.filter((r) => !ids.includes(r.id))); };
  // startDate defaults to the record being written, so a product added while back-filling an
  // earlier day covers that day on the charts instead of starting "today"
  const quickAddProduct = (name, startDate) => {
    const prod = { id: uid(), name: name.trim(), startDate: startDate || todayStr(), endDate: null, color: PALETTE[products.length % PALETTE.length].key };
    persistProducts([...products, prod]);
    return prod;
  };
  const loadSampleData = () => {
    const { products: sp, records: sr } = buildSampleData();
    persistProducts(sp);
    persistRecords(sr);
  };

  const openDayByDate = (date) => {
    const rec = records.find((r) => r.date === date);
    if (!rec) return;
    setModal({ type: "dayPanel", payload: rec });
  };
  const openInHistory = (date) => { setTab("history"); openDayByDate(date); };

  const handleSelectRole = (r) => {
    if (r === "owner" && ownerPin) {
      setPinInput(""); setPinError(""); setPinPrompt(true);
    } else {
      enterAs(r);
    }
  };
  const submitPin = () => {
    if (pinInput === ownerPin) {
      setPinPrompt(false); setPinInput(""); setPinError("");
      enterAs("owner");
    } else {
      setPinError("PIN 不正確，請再試一次");
      setPinInput("");
    }
  };
  const setNewPin = async (pin) => { await savePin(pin); setOwnerPin(pin); };
  const removePin = async () => { await clearPin(); setOwnerPin(""); };

  const existingDates = records.map((r) => r.date);
  const TAB_META = {
    dashboard: { label: "趨勢總覽", Icon: HeartIcon, desc: "圖表與健康趨勢", bg: COLORS.accentSoft },
    history: { label: "飲食日記", Icon: JournalIcon, desc: "新增紀錄、管理產品", bg: COLORS.blueSoft },
    export: { label: "匯出", Icon: Download, desc: "匯出 Excel／複製表格", bg: "#F3DEE0" },
    meds: { label: "用藥清單", Icon: Pill, desc: "常用藥、用藥紀錄", bg: "#DDEBD8" },
  };
  const tabs = role === "owner"
    ? [["dashboard", "趨勢總覽"], ["history", "飲食日記"], ["export", "匯出"], ["meds", "用藥清單"]]
    : [["dashboard", "趨勢總覽"], ["history", "飲食日記"], ["export", "匯出"], ["meds", "用藥清單"]];

  useEffect(() => { if (role === "vet" && tab && !["dashboard", "history", "export", "meds"].includes(tab)) setTab(null); }, [role]); // eslint-disable-line

  if (screen === "landing") {
    return (
      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", background: COLORS.bg, minHeight: "100%", color: COLORS.ink }}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
          * { box-sizing: border-box; }
        `}</style>
        {pinPrompt ? (
          <PinPromptScreen
            value={pinInput} onChange={setPinInput} error={pinError}
            onSubmit={submitPin} onCancel={() => { setPinPrompt(false); setPinInput(""); setPinError(""); }}
          />
        ) : (
          <LandingScreen onEnter={handleSelectRole} pinSet={!!ownerPin} />
        )}
      </div>
    );
  }

  if (screen === "pets") {
    return (
      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", background: COLORS.bg, minHeight: "100%", color: COLORS.ink }}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
          * { box-sizing: border-box; }
          input, select, textarea { font-family: inherit; }
        `}</style>
        <PetPickerScreen
          pets={pets} role={role} onPick={choosePet}
          onAdd={role === "owner" ? () => setPetModal({ mode: "add" }) : undefined}
          onEdit={role === "owner" ? (p) => setPetModal({ mode: "edit", pet: p }) : undefined}
          onBack={() => setScreen("landing")}
        />
        {petModal && (
          <Modal title={petModal.mode === "add" ? "新增寵物" : "編輯寵物"} onClose={() => setPetModal(null)}>
            <PetForm
              initial={petModal.pet}
              canDelete={pets.length > 1}
              onSave={savePet}
              onDelete={(id) => setConfirmDialog({ message: `確定要刪除「${petModal.pet?.name}」和牠的所有紀錄嗎？無法復原。`, onYes: () => deletePet(id) })}
              onCancel={() => setPetModal(null)}
            />
          </Modal>
        )}
        {confirmDialog && (
          <Modal title="請確認" onClose={() => setConfirmDialog(null)}>
            <div style={{ fontSize: 14, color: COLORS.ink, lineHeight: 1.6, marginBottom: 20 }}>{confirmDialog.message}</div>
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
              <Btn variant="ghost" onClick={() => setConfirmDialog(null)}>取消</Btn>
              <Btn variant="danger" onClick={() => { confirmDialog.onYes(); setConfirmDialog(null); }}>確定</Btn>
            </div>
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div style={{
      fontFamily: "'IBM Plex Sans', sans-serif", background: COLORS.bg, minHeight: "100%", color: COLORS.ink,
      backgroundImage: `url("${PAW_PATTERN_URL}")`, backgroundRepeat: "repeat",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        input, select, textarea { font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: 2px solid ${COLORS.accent}44; border-color: ${COLORS.accent}; }
        @media (min-width: 640px) {
          /* Full-screen on desktop too: the record form is long, and a small centred box
             wastes the screen and makes everything cramped. */
          .modal-backdrop { padding: 0; }
          .modal-sheet {
            height: 100dvh !important; max-height: none; border-radius: 0;
            max-width: none !important; width: 100% !important;
          }
          /* Keep the content itself in a readable column inside the full-width sheet */
          .modal-sheet > div:nth-child(2) > * { max-width: 860px; margin-left: auto; margin-right: auto; }
          .modal-sheet > div:first-child, .modal-sheet > div:last-child { padding-left: max(24px, calc((100vw - 860px) / 2)) !important; padding-right: max(24px, calc((100vw - 860px) / 2)) !important; }
          .app-shell { padding-top: 28px !important; max-width: 980px !important; }
          /* The phone layout is tuned for a ~380px column; scale the small text up on a laptop
             so the calendar, list and buttons stay readable at desktop viewing distance. */
          .app-shell h1 { font-size: 30px !important; }
          .modal-sheet h3 { font-size: 21px !important; }
          .app-shell button, .app-shell input, .app-shell select, .app-shell textarea,
          .modal-sheet button, .modal-sheet input, .modal-sheet select, .modal-sheet textarea { font-size: 15px; }
          .app-shell div, .app-shell span, .modal-sheet div, .modal-sheet span { font-size: inherit; }
          .app-shell, .modal-sheet { font-size: 15px; }
          .app-shell [style*="font-size: 10px"], .modal-sheet [style*="font-size: 10px"] { font-size: 12px !important; }
          .app-shell [style*="font-size: 11px"], .modal-sheet [style*="font-size: 11px"] { font-size: 13px !important; }
          .app-shell [style*="font-size: 12px"], .modal-sheet [style*="font-size: 12px"] { font-size: 14px !important; }
          .app-shell [style*="font-size: 13px"], .modal-sheet [style*="font-size: 13px"] { font-size: 15px !important; }
          .app-shell [style*="font-size: 14px"], .modal-sheet [style*="font-size: 14px"] { font-size: 16px !important; }
          .app-shell [style*="font-size: 15px"], .modal-sheet [style*="font-size: 15px"] { font-size: 17px !important; }
          /* Calendar tiles get very tall when the grid is wide; cap them and enlarge the numbers */
          .app-shell [style*="aspect-ratio"] { aspect-ratio: auto !important; min-height: 84px; }
          .app-shell .cal-day { font-size: 20px !important; }
          .app-shell .cal-grams { font-size: 15px !important; }
          .app-shell .cal-dots span { width: 8px !important; height: 8px !important; border-radius: 4px !important; }
        }
      `}</style>

      <div className="app-shell" style={{ maxWidth: 720, margin: "0 auto", padding: "16px 16px 40px", paddingTop: "calc(env(safe-area-inset-top, 0px) + 60px)" }}>
        {/* Back sits above the title as a large tap target; the settings-style switches stay
            on the right so they can't be hit by mistake. */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, gap: 8 }}>
          {tab !== null ? (
            <button onClick={() => setTab(null)} style={{
              display: "flex", alignItems: "center", gap: 4, background: "#fff",
              border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: "10px 16px 10px 12px",
              cursor: "pointer", color: COLORS.accent, fontSize: 15, fontWeight: 700, flexShrink: 0,
              boxShadow: COLORS.shadow,
            }}><ChevronLeft size={20} />返回</button>
          ) : <div />}
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <button onClick={() => { setScreen("pets"); setTab(null); }} title="切換寵物" style={{
            display: "flex", alignItems: "center", gap: 5, background: "#fff", border: `1px solid ${COLORS.line}`,
            borderRadius: 9, padding: "7px 10px", cursor: "pointer", color: COLORS.inkSoft, fontSize: 12, fontWeight: 600,
          }}><PawIcon size={13} color={COLORS.inkSoft} />切換寵物</button>
          <button onClick={() => { setScreen("landing"); setTab(null); }} title="切換主人／醫師模式" style={{
            display: "flex", alignItems: "center", gap: 5, background: "#fff", border: `1px solid ${COLORS.line}`,
            borderRadius: 9, padding: "7px 10px", cursor: "pointer", color: COLORS.inkSoft, fontSize: 12, fontWeight: 600,
          }}>{role === "owner" ? <User size={13} /> : <Stethoscope size={13} />}切換主人／醫師</button>
          {role === "owner" && (
            <button onClick={() => setPinSettingsOpen(true)} title="PIN 保護設定" style={{
              display: "flex", alignItems: "center", gap: 5, background: "#fff", border: `1px solid ${COLORS.line}`,
              borderRadius: 9, padding: "7px 10px", cursor: "pointer", color: COLORS.inkSoft, fontSize: 12, fontWeight: 600,
            }}><LockIcon size={14} color={ownerPin ? COLORS.accent : COLORS.inkSoft} /></button>
          )}
          </div>
        </div>

        <div style={{ marginBottom: 6 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
            <PawIcon size={18} color={COLORS.accent} />
            <h1 style={{ fontFamily: "'Source Serif 4', serif", fontSize: 24, margin: 0, color: COLORS.ink }}>
              {currentPet ? `${currentPet.name}的飲食記錄` : "飲食記錄"}
            </h1>
          </div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2, display: "flex", alignItems: "center", gap: 5 }}>
            {tab !== null && TAB_META[tab]?.Icon && React.createElement(TAB_META[tab].Icon, { size: 14, color: COLORS.accent })}
            {tab !== null
              ? <span style={{ color: COLORS.ink, fontWeight: 700 }}>{TAB_META[tab]?.label}</span>
              : (role === "owner" ? "主人模式" : "醫師模式（唯讀）")}
          </div>
          {role === "owner" && (
            <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 2 }}>
              {vetViewedAt ? `醫師最後查看：${formatRelativeTime(vetViewedAt)}` : "醫師尚未查看過"}
            </div>
          )}
        </div>

        {loadError && (
          <div style={{
            background: COLORS.dangerSoft, border: `1px solid ${COLORS.danger}44`,
            borderRadius: 12, padding: "12px 14px", marginBottom: 14,
            fontSize: 13, color: COLORS.danger, fontWeight: 600,
          }}>
            {loadError}
          </div>
        )}

        {loading || petLoading ? (
          <div style={{ textAlign: "center", padding: 40, color: COLORS.inkSoft }}>載入中…</div>
        ) : tab === null ? (
          // ---- Layer 2: hub menu — health summary, then hand-drawn icon tiles ----
          <>
          <HealthSummary records={records} products={products} />
          {role === "owner" && (
            <Card style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.ink, marginBottom: 8 }}>今日用藥</div>
              <MedSection
                date={todayStr()}
                medPresets={medPresets}
                medLogs={medLogs}
                role={role}
                onTogglePreset={(preset) => toggleMedPreset(todayStr(), preset)}
                onAddManual={(entry) => addManualMedLog(todayStr(), entry)}
                onRemoveLog={removeMedLog}
                onManagePresets={() => setMedPresetsOpen(true)}
              />
            </Card>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            {tabs.map(([key]) => {
              const meta = TAB_META[key];
              return (
                <button
                  key={key}
                  onClick={() => setTab(key)}
                  style={{
                    display: "flex", flexDirection: "column", alignItems: "center", gap: 8,
                    padding: "22px 12px", borderRadius: 18, border: `1px solid ${COLORS.line}`,
                    background: "#fff", boxShadow: COLORS.shadow, cursor: "pointer", textAlign: "center",
                  }}
                >
                  <div style={{ width: 52, height: 52, borderRadius: 16, background: meta.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <meta.Icon size={26} color={COLORS.accent} />
                  </div>
                  <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink }}>{meta.label}</div>
                  <div style={{ fontSize: 11, color: COLORS.inkSoft }}>{meta.desc}</div>
                </button>
              );
            })}
          </div>
          </>
        ) : (
          // ---- Layer 3: section detail, with a way back to the hub ----
          <div>
            {tab === "dashboard" && (
              <Dashboard
                records={records} products={products}
                role={role} existingDates={existingDates}
                onSaveRecord={saveRecord} onDeleteRecord={deleteRecord}
                onOpenInHistory={openInHistory} onQuickAddProduct={quickAddProduct}
                medPresets={medPresets} medLogs={medLogs}
                onSetDayMeds={setDayMedPresets} onAddManualMed={addManualMedLog}
                onRemoveMedLog={removeMedLog}
                onManageMedPresets={role === "owner" ? () => setMedPresetsOpen(true) : undefined}
              />
            )}
            {tab === "history" && (
              <History
                records={records} products={products} onSelect={openDayByDate}
                onDeleteMany={deleteRecords} onConfirm={setConfirmDialog}
                role={role} existingDates={existingDates}
                onAddRecord={role === "owner" ? saveRecord : undefined}
                onQuickAddProduct={role === "owner" ? quickAddProduct : undefined}
                onAddProduct={role === "owner" ? () => setModal({ type: "addProduct" }) : undefined}
                onEditProduct={role === "owner" ? (p) => setModal({ type: "editProduct", payload: p }) : undefined}
                onLoadSample={role === "owner" ? loadSampleData : undefined}
                medPresets={medPresets} medLogs={medLogs}
                onSetDayMeds={setDayMedPresets} onAddManualMed={addManualMedLog}
                onRemoveMedLog={removeMedLog}
                onManageMedPresets={role === "owner" ? () => setMedPresetsOpen(true) : undefined}
              />
            )}
            {tab === "export" && <ExportPanel records={records} products={products} petName={currentPet?.name} />}
            {tab === "meds" && (
              <MedicationsScreen
                medPresets={medPresets} medLogs={medLogs} role={role}
                onAddPreset={(preset) => persistMedPresets([...medPresets, preset])}
                onRemovePreset={(id) => persistMedPresets(medPresets.filter((p) => p.id !== id))}
                onRemoveLog={removeMedLog}
              />
            )}
          </div>
        )}
      </div>

      {modal?.type === "addProduct" && (
        <Modal title="新增產品" onClose={() => setModal(null)}>
          <ProductForm onSave={saveProduct} onCancel={() => setModal(null)} />
        </Modal>
      )}
      {modal?.type === "editProduct" && (
        <Modal title="編輯產品" onClose={() => setModal(null)}>
          <ProductForm initial={modal.payload} onSave={saveProduct} onCancel={() => setModal(null)} onDelete={deleteProduct} />
        </Modal>
      )}
      {modal?.type === "dayPanel" && (() => {
        // Days in date order, so the panel can step to the previous / next recorded day
        const ordered = [...records].sort((a, b) => a.date.localeCompare(b.date));
        const idx = ordered.findIndex((r) => r.id === modal.payload.id);
        const goTo = (i) => { if (ordered[i]) setModal({ type: "dayPanel", payload: ordered[i] }); };
        return (
          <Modal title="飲食日記" onClose={() => setModal(null)}>
            <DayPanelBody
              key={modal.payload.date}
              record={modal.payload}
              product={products.find((p) => p.id === modal.payload.productId)}
              role={role}
              products={products}
              existingDates={existingDates}
              onSave={(rec) => { saveRecord(rec); }}
              onDelete={(id) => { deleteRecord(id); }}
              onQuickAddProduct={quickAddProduct}
              onPrevDay={idx > 0 ? () => goTo(idx - 1) : null}
              onNextDay={idx >= 0 && idx < ordered.length - 1 ? () => goTo(idx + 1) : null}
              prevDate={idx > 0 ? ordered[idx - 1].date : null}
              nextDate={idx >= 0 && idx < ordered.length - 1 ? ordered[idx + 1].date : null}
              medPresets={medPresets} medLogs={medLogs}
              onSetDayMeds={setDayMedPresets} onAddManualMed={addManualMedLog}
              onRemoveMedLog={removeMedLog}
              onManageMedPresets={role === "owner" ? () => setMedPresetsOpen(true) : undefined}
            />
          </Modal>
        );
      })()}

      {medPresetsOpen && (
        <MedPresetManager
          medPresets={medPresets}
          onAdd={(preset) => persistMedPresets([...medPresets, preset])}
          onRemove={(id) => persistMedPresets(medPresets.filter((p) => p.id !== id))}
          onClose={() => setMedPresetsOpen(false)}
        />
      )}

      {pinSettingsOpen && (
        <Modal title="PIN 保護設定" onClose={() => setPinSettingsOpen(false)}>
          <PinSettingsForm
            currentPin={ownerPin}
            onSetPin={async (pin) => { await setNewPin(pin); setPinSettingsOpen(false); }}
            onRemovePin={async () => { await removePin(); setPinSettingsOpen(false); }}
            onClose={() => setPinSettingsOpen(false)}
          />
        </Modal>
      )}

      {confirmDialog && (
        <Modal title="請確認" onClose={() => setConfirmDialog(null)}>
          <div style={{ fontSize: 14, color: COLORS.ink, lineHeight: 1.6, marginBottom: 20 }}>{confirmDialog.message}</div>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
            <Btn variant="ghost" onClick={() => setConfirmDialog(null)}>取消</Btn>
            <Btn variant="danger" onClick={() => { confirmDialog.onYes(); setConfirmDialog(null); }}>確定</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

<script>
(function () {
  function showErr(msg) {
    var b = document.getElementById("boot");
    if (!b) return;
    b.innerHTML = '<div style="color:#B1503A;text-align:left;white-space:pre-wrap;font-size:13px;line-height:1.5">載入失敗，請把這段截圖給 Claude：\n\n' + msg + '</div>';
  }
  window.addEventListener("error", function (e) {
    var where = e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "";
    showErr((e.message || String(e)) + where);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason; showErr("Promise: " + (r && (r.message || r.code || r) || r));
  });

  // Load a script, trying each CDN in turn until the expected global appears
  function load(name, urls, check) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      function tryNext() {
        if (check()) return resolve();
        if (i >= urls.length) return reject(new Error("套件載入失敗：" + name + "（所有 CDN 都連不上）"));
        var s = document.createElement("script");
        s.src = urls[i++];
        s.crossOrigin = "anonymous";
        s.onload = function () { check() ? resolve() : tryNext(); };
        s.onerror = tryNext;
        document.head.appendChild(s);
      }
      tryNext();
    });
  }

  // ---- Firebase project config (web API keys are public by design; access is controlled by Firestore rules) ----
  var firebaseConfig = {
    apiKey: "AIzaSyBr4OtGSYf8acst231oLk00JrzqmqxhXEM",
    authDomain: "pet-diet-diary.firebaseapp.com",
    projectId: "pet-diet-diary",
    storageBucket: "pet-diet-diary.firebasestorage.app",
    messagingSenderId: "722876242383",
    appId: "1:722876242383:web:22ed30f8bbc58e0a781aba"
  };

  (async function boot() {
    try {
      if (!window.firebase) throw new Error("Firebase SDK 沒載入");
      firebase.initializeApp(firebaseConfig);
      var kv = firebase.firestore().collection("kv");
      // The app was written against a tiny key-value API; this provides it on top of Firestore
      window.storage = {
        get: async function (key) {
          var snap = await kv.doc(key).get();
          // Return null for "no such document" instead of throwing, so callers can tell a
          // genuinely-absent key apart from a read that failed (network/quota). Conflating
          // the two is what let a failed read masquerade as "first run" and overwrite the
          // pet list with a fresh default. Real failures still throw.
          if (!snap.exists) return null;
          return { key: key, value: snap.data().value, shared: true };
        },
        set: async function (key, value) {
          await kv.doc(key).set({ value: String(value), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
          return { key: key, value: value, shared: true };
        },
        delete: async function (key) { await kv.doc(key).delete(); return { key: key, deleted: true, shared: true }; },
        list: async function (prefix) {
          var snap = await kv.get();
          return { keys: snap.docs.map(function (d) { return d.id; }).filter(function (k) { return !prefix || k.indexOf(prefix) === 0; }), prefix: prefix, shared: true };
        }
      };

      await load("React", [
        "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
        "https://unpkg.com/react@18.3.1/umd/react.production.min.js"
      ], function () { return !!window.React; });
      await load("ReactDOM", [
        "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
        "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      ], function () { return !!window.ReactDOM; });
      await load("PropTypes", [
        "https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js",
        "https://unpkg.com/prop-types@15.8.1/prop-types.min.js"
      ], function () { return !!window.PropTypes; });
      await load("Recharts", [
        "https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js",
        "https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js",
        "https://unpkg.com/recharts@2.12.7/umd/Recharts.js"
      ], function () { return !!window.Recharts; });
      await load("d3", [
        "https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js",
        "https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
      ], function () { return !!window.d3; });
      await load("ExcelJS", [
        "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js",
        "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"
      ], function () { return !!window.ExcelJS; });
      await load("Babel", [
        "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js",
        "https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"
      ], function () { return !!window.Babel; });

      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, { presets: ["react"], filename: "app.jsx" }).code;
      (new Function(out))();
    } catch (e) {
      showErr((e && (e.message || e.code)) || String(e));
    }
  })();
})();
</script>
</body>
</html>
