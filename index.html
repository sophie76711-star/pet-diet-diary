<script>
  // Surface any load/compile/runtime failure on screen instead of a silent "載入中…"
  function showErr(msg) {
    var b = document.getElementById("boot");
    if (!b) return;
    b.innerHTML = '<div style="color:#B1503A;text-align:left;white-space:pre-wrap;font-size:13px;line-height:1.5">載入失敗，請把這段截圖給 Claude：\n\n' + msg + '</div>';
  }
  window.addEventListener("error", function (e) {
    var where = e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "";
    showErr((e.message || String(e)) + where);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason; showErr("Promise: " + (r && (r.message || r.code || r) || r));
  });
</script>

    messagingSenderId: "722876242383",
    appId: "1:722876242383:web:22ed30f8bbc58e0a781aba"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const kv = db.collection("kv");

  // The app was written against a tiny key-value API (get/set/delete). This shim provides the
  // same API on top of Firestore: one document per key in the "kv" collection.
  window.storage = {
    async get(key) {
      const snap = await kv.doc(key).get();
      if (!snap.exists) throw new Error("key not found: " + key);
      return { key, value: snap.data().value, shared: true };
    },
    async set(key, value) {
      await kv.doc(key).set({ value: String(value), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      return { key, value, shared: true };
    },
    async delete(key) {
      await kv.doc(key).delete();
      return { key, deleted: true, shared: true };
    },
    async list(prefix) {
      const snap = await kv.get();
      const keys = snap.docs.map((d) => d.id).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: true };
    },
  };
</script>

// ---------- storage ----------
// Records and products are namespaced per pet; the old un-namespaced keys are migrated once.
const KEY_PETS = "cat-diet-pets";
const KEY_PRODUCTS = "cat-diet-products";
const KEY_RECORDS = "cat-diet-records";
const KEY_PIN = "cat-diet-owner-pin";
const productsKey = (petId) => `${KEY_PRODUCTS}:${petId}`;
const recordsKey = (petId) => `${KEY_RECORDS}:${petId}`;

async function loadKey(key) {
  try {
    const res = await window.storage.get(key, true);
    return res ? JSON.parse(res.value) : [];
  } catch (e) {
    return [];
  }
}
async function saveKey(key, data) {
  try {
    await window.storage.set(key, JSON.stringify(data), true);
    return true;
  } catch (e) {
    console.error("storage save failed", e);
    return false;
  }
}
async function loadPin() {
  try {
    const res = await window.storage.get(KEY_PIN, true);
    return res ? res.value : "";
  } catch (e) {
    return "";
  }
}
async function savePin(pin) {
  try { await window.storage.set(KEY_PIN, pin, true); return true; } catch (e) { return false; }
}
async function clearPin() {
  try { await window.storage.delete(KEY_PIN, true); return true; } catch (e) { return false; }
}

// Loads the pet list, creating a default pet (and moving any pre-multi-pet data into it) on first run
async function loadPetsWithMigration() {
  let pets = await loadKey(KEY_PETS);
  if (Array.isArray(pets) && pets.length > 0) return pets;

  const legacyProducts = await loadKey(KEY_PRODUCTS);
  const legacyRecords = await loadKey(KEY_RECORDS);
  const pet = { id: "pet-1", name: "辛巴" };
  pets = [pet];
  await saveKey(KEY_PETS, pets);
  if (legacyProducts.length || legacyRecords.length) {
    await saveKey(productsKey(pet.id), legacyProducts);
    await saveKey(recordsKey(pet.id), legacyRecords);
  }
  return pets;
}

function Btn({ children, onClick, variant = "primary", size = "md", disabled, type = "button", style }) {
  const base = {
    fontFamily: "'IBM Plex Sans', sans-serif",
    fontWeight: 600,
    borderRadius: 10,
    border: "1px solid transparent",
    cursor: disabled ? "not-allowed" : "pointer",

    opacity: disabled ? 0.5 : 1,

  const sizes = { sm: { padding: "6px 12px", fontSize: 13 }, md: { padding: "10px 16px", fontSize: 14 } };
  const variants = {
    primary: { background: COLORS.accent, color: "#fff" },
    secondary: { background: COLORS.accentSoft, color: COLORS.accent },
    danger: { background: COLORS.dangerSoft, color: COLORS.danger },
    ghost: { background: "transparent", color: COLORS.inkSoft, border: `1px solid ${COLORS.line}` },
  };
  return (
    <button
      type={type}
      disabled={disabled}
      onClick={onClick}
      style={{ ...base, ...sizes[size], ...variants[variant], ...style }}
      onMouseDown={(e) => { e.currentTarget.style.transform = "scale(0.97)"; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = "scale(1)"; }}
    >
      {children}
    </button>
  );
}

}

function ScoreButtons({ value, onChange, min, max, labels, disabled, color }) {
  const nums = [];
  for (let i = min; i <= max; i++) nums.push(i);
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
      {nums.map((n) => {
        const active = value === n;
        return (
          <button
            key={n}
            type="button"
            disabled={disabled}
            onClick={() => onChange(n)}
            title={labels && labels[n] ? labels[n] : undefined}
            style={{
              width: 36, height: 36, borderRadius: 9,
              border: `1px solid ${active ? color : COLORS.line}`,
              background: active ? color : "#fff",
              color: active ? "#fff" : COLORS.ink,
              fontWeight: 700, fontSize: 14, cursor: disabled ? "default" : "pointer",
            }}
          >
            {n}
          </button>
        );
      })}
    </div>
  );
}

function BristolPlaceholder({ compact }) {
  return (
    <div style={{
      border: `1px solid ${COLORS.line}`, borderRadius: 12,
      padding: 6, background: "#fff",
      display: "flex", alignItems: "center", justifyContent: "center",
      minHeight: compact ? 90 : 140, overflow: "hidden",
    }}>
      <img
        src={BRISTOL_CHART_IMAGE}
        alt="Bristol Stool Scale 對照圖：Type 1 分離硬塊，Type 2 硬香腸狀，Type 3 表面有裂痕的香腸狀，Type 4 光滑柔軟的香腸/蛇狀，Type 5 邊緣清楚的軟塊，Type 6 邊緣不規則的鬆散糊狀，Type 7 完全液狀"
        style={{ maxWidth: "100%", maxHeight: compact ? 220 : 320, objectFit: "contain", borderRadius: 8 }}
      />
    </div>
  );
}

// ---------- Record Form (used for add / edit) ----------
function RecordForm({ initial, products, existingDates, onSave, onCancel, onDelete, onQuickAddProduct }) {
  const [date, setDate] = useState(initial?.date || todayStr());
  const [productId, setProductId] = useState(initial?.productId || (products[0]?.id ?? ""));
  const [breakfast, setBreakfast] = useState(initial?.breakfast ?? 0);
  const [dinner, setDinner] = useState(initial?.dinner ?? 0);
  const [bedtime, setBedtime] = useState(initial?.bedtime ?? 0);
  const [mental, setMental] = useState(initial?.mental ?? 3);
  const [stool, setStool] = useState(initial?.stool ?? 4);
  const [vomit, setVomit] = useState(initial?.vomit ?? 0);
  const [other, setOther] = useState(initial?.other || "");
  const [stress, setStress] = useState(initial?.stress || "");
  const [error, setError] = useState("");
  const [addingProduct, setAddingProduct] = useState(false);
  const [newProductName, setNewProductName] = useState("");

  const total = (Number(breakfast) || 0) + (Number(dinner) || 0) + (Number(bedtime) || 0);

  const handleSave = () => {
    if (!date) { setError("請選擇日期"); return; }
    if (!initial && existingDates.includes(date)) {
      setError("這一天已經有紀錄了，請改用「飲食日記」修改該筆資料。");
      return;
    }
    if (!productId) { setError("請選擇當天食用的產品，或用上面的「＋ 新增產品」直接建立一個。"); return; }
    onSave({
      id: initial?.id || uid(),
      date, productId,
      breakfast: Math.max(0, Number(breakfast) || 0),
      dinner: Math.max(0, Number(dinner) || 0),
      bedtime: Math.max(0, Number(bedtime) || 0),
      mental: Number(mental), stool: Number(stool), vomit: Number(vomit),
      other, stress,
    });
  };

  return (
    <div>
      {error && (
        <div style={{
          display: "flex", gap: 8, alignItems: "flex-start", background: COLORS.dangerSoft,
          color: COLORS.danger, padding: "10px 12px", borderRadius: 10, fontSize: 13, marginBottom: 14,
        }}>
          <AlertCircle size={16} style={{ flexShrink: 0, marginTop: 1 }} />
          <span>{error}</span>
        </div>
      )}
      <Field label="日期">
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} disabled={!!initial} />
      </Field>
      <Field label="食用產品">
        <select value={productId} onChange={(e) => {
          if (e.target.value === "__new__") { setAddingProduct(true); }
          else { setProductId(e.target.value); }
        }} style={inputStyle}>
          {products.length === 0 && <option value="">尚無產品</option>}
          {products.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
          {onQuickAddProduct && <option value="__new__">＋ 新增產品...</option>}
        </select>
        {addingProduct && (
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <input value={newProductName} onChange={(e) => setNewProductName(e.target.value)} style={inputStyle} placeholder="新產品名稱，例如：GI32" autoFocus />
            <Btn size="sm" onClick={() => {
              if (!newProductName.trim()) return;
              const prod = onQuickAddProduct(newProductName, date);
              setProductId(prod.id);
              setNewProductName("");
              setAddingProduct(false);
            }}>新增</Btn>
            <Btn size="sm" variant="ghost" onClick={() => { setAddingProduct(false); setNewProductName(""); }}>取消</Btn>
          </div>
        )}
      </Field>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
        <Field label="早餐 (g)"><input type="number" min="0" value={breakfast} onChange={(e) => setBreakfast(e.target.value)} style={inputStyle} /></Field>
        <Field label="晚餐 (g)"><input type="number" min="0" value={dinner} onChange={(e) => setDinner(e.target.value)} style={inputStyle} /></Field>
        <Field label="睡前 (g)"><input type="number" min="0" value={bedtime} onChange={(e) => setBedtime(e.target.value)} style={inputStyle} /></Field>
      </div>

      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center",
        background: COLORS.accentSoft, borderRadius: 10, padding: "10px 14px", marginBottom: 14,
      }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: COLORS.accent }}>每日總量（自動計算）</span>
        <span style={{ fontSize: 18, fontWeight: 700, color: COLORS.accent }}>{total} g</span>
      </div>

      <Field label="精神分數 (0～5)">
        <ScoreButtons value={Number(mental)} onChange={setMental} min={0} max={5} color={COLORS.accent} />
      </Field>

      <Field label="便便分數 — Bristol Stool Scale (1～7)">
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-start" }}>
          <ScoreButtons value={Number(stool)} onChange={setStool} min={1} max={7} color={COLORS.gold} />
          <div style={{ flex: "1 1 160px", minWidth: 140 }}><BristolPlaceholder compact /></div>
        </div>
      </Field>

      <Field label="嘔吐次數 (0～5)">
        <ScoreButtons value={Number(vomit)} onChange={setVomit} min={0} max={5} color={COLORS.danger} />
      </Field>

      <Field label="壓力事件"><textarea value={stress} onChange={(e) => setStress(e.target.value)} rows={2} style={{ ...inputStyle, resize: "vertical" }} placeholder="例如：搬家、有客人來訪、打雷..." /></Field>
      <Field label="其他備註"><textarea value={other} onChange={(e) => setOther(e.target.value)} rows={2} style={{ ...inputStyle, resize: "vertical" }} /></Field>

      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18, gap: 10 }}>
        <div>
          {initial && onDelete && (
            <Btn variant="danger" onClick={() => onDelete(initial.id)}><Trash2 size={15} />刪除</Btn>
          )}
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <Btn variant="ghost" onClick={onCancel}>取消</Btn>
          <Btn onClick={handleSave}><Check size={15} />儲存</Btn>
        </div>
      </div>
    </div>
  );
}

// ---------- Product Form ----------
function ProductForm({ initial, onSave, onCancel, onDelete }) {
  const [name, setName] = useState(initial?.name || "");
  const [startDate, setStartDate] = useState(initial?.startDate || todayStr());
  const [endDate, setEndDate] = useState(initial?.endDate || "");
  const [color, setColor] = useState(initial?.color || PALETTE[0].key);
  const [error, setError] = useState("");

  const handleSave = () => {
    if (!name.trim()) { setError("請輸入產品名稱"); return; }
    if (!startDate) { setError("請選擇開始使用日期"); return; }
    if (endDate && endDate < startDate) { setError("結束日期不能早於開始日期"); return; }
    onSave({ id: initial?.id || uid(), name: name.trim(), startDate, endDate: endDate || null, color });
  };

  return (
    <div>
      {error && (
        <div style={{ background: COLORS.dangerSoft, color: COLORS.danger, padding: "10px 12px", borderRadius: 10, fontSize: 13, marginBottom: 14 }}>
          {error}
        </div>
      )}
      <Field label="產品名稱"><input value={name} onChange={(e) => setName(e.target.value)} style={inputStyle} placeholder="例如：GI32" /></Field>
      <Field label="開始使用日期"><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} style={inputStyle} /></Field>
      <Field label="結束使用日期" hint="可留空，表示目前仍在使用"><input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} style={inputStyle} /></Field>
      <Field label="圖表背景顏色">
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {PALETTE.map((p) => (
            <button key={p.key} type="button" onClick={() => setColor(p.key)}
              style={{
                width: 34, height: 34, borderRadius: 9, background: p.bg,
                border: `2px solid ${color === p.key ? p.border : "transparent"}`,
                boxShadow: color === p.key ? `0 0 0 1px ${p.border}` : "none", cursor: "pointer",
              }} />
          ))}
        </div>
      </Field>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18, gap: 10 }}>
        <div>{initial && onDelete && <Btn variant="danger" onClick={() => onDelete(initial.id)}><Trash2 size={15} />刪除</Btn>}</div>
        <div style={{ display: "flex", gap: 10 }}>
          <Btn variant="ghost" onClick={onCancel}>取消</Btn>
          <Btn onClick={handleSave}><Check size={15} />儲存</Btn>
        </div>
      </div>
    </div>
  );
}

const CHART_META = {
  health: { title: "健康趨勢（食量＋精神）", short: "健康趨勢", kind: "health", legend: HEALTH_SERIES, icon: HeartIcon },
  total: { title: "每日總攝食量 (g)", short: "總攝食量", kind: "total", icon: BowlIcon },
  mental: { title: "精神分數 (0～5)", short: "精神分數", kind: "mental", icon: HeartIcon },
  stool: { title: "便便分數（Bristol，3～4 為正常）", short: "便便分數", kind: "stool", icon: JournalIcon },
  events: { title: "異常事件時間軸", short: "異常事件", kind: "events", legend: EVENT_SERIES, icon: BellIcon },
};

function paddedDomain(slice) {
  if (!slice.length) return [toTs(todayStr()) - 43200000, toTs(todayStr()) + 43200000];
  const tss = slice.map((d) => d.ts);
  return [Math.min(...tss) - 43200000, Math.max(...tss) + 43200000];
}

// One chart component that renders every metric view (avoids duplicating chart markup per metric)

// A curve that looks hand-inked: monotone smoothing, but every point gets a small, stable wobble
// (seeded by its index so it never jitters between renders). Dots stay on the true values.
const handInked = (context) => {
  const inner = d3.curveMonotoneX(context);
  let i = 0;
  const wobble = (n, salt) => ((((n * 7919 + salt * 104729) % 97) / 97) - 0.5) * 2.6; // ±1.3px
  return {
    lineStart() { i = 0; inner.lineStart(); },
    lineEnd() { inner.lineEnd(); },
    point(x, y) { inner.point(x + wobble(i, 1), y + wobble(i, 2)); i++; },
    areaStart() { inner.areaStart && inner.areaStart(); },
    areaEnd() { inner.areaEnd && inner.areaEnd(); },
  };
};

function MetricChart({ data, bands, domain, height, onPointClick, products, kind }) {
  const dotClick = (payload) => { if (payload && payload.date) onPointClick(payload.date); };
  // Hollow, ink-ringed dots (like the chosen sample): white fill with a colored ring, kept small
  // enough that the line stays continuous between dense points. Big invisible touch target behind.
  const makeDot = (color, r = 4) => (props) => {
    const { cx, cy, payload } = props;
    if (cx == null || cy == null) return null;
    return (
      <g key={payload.date} style={{ cursor: "pointer" }} onClick={() => dotClick(payload)}>
        <circle cx={cx} cy={cy} r={16} fill="transparent" />
        <circle cx={cx} cy={cy} r={r} fill="#fff" stroke={color} strokeWidth={2.6} />
      </g>
    );
  };
  const makeEventDot = (color) => (props) => {
    const { cx, cy, payload } = props;
    if (cx == null || cy == null) return null;
    return (
      <g key={payload.date} style={{ cursor: "pointer" }} onClick={() => dotClick(payload)}>
        <circle cx={cx} cy={cy} r={16} fill="transparent" />
        <circle cx={cx} cy={cy} r={5.5} fill="#fff" stroke={color} strokeWidth={3} />
      </g>
    );
  };
  const lineProps = { type: handInked, strokeLinecap: "round", strokeLinejoin: "round", isAnimationActive: false };
  // Ticks come from real recorded days (about 6 of them) so every chart — including the sparse
  // events chart — gets a consistent, readable axis instead of whatever the scale auto-picks.
  const tickStep = Math.max(1, Math.ceil(data.length / 6));
  const ticks = data.filter((_, i) => i % tickStep === 0 || i === data.length - 1).map((d) => d.ts);
  const xAxisProps = { dataKey: "ts", type: "number", domain, scale: "time", ticks, tickFormatter: fmtMD, stroke: COLORS.inkSoft, tick: { fontSize: 11 } };
  // Bands are clamped to the visible window so a product that started before the window still
  // gets its label at the visible left edge. Labels sit at the bottom, which is the emptiest area.
  // ReferenceArea must name the y-axis in dual-axis charts, otherwise it silently doesn't render.
  const bandEls = (yAxisId) => bands
    .map((b) => ({ ...b, x1: Math.max(b.x1, domain[0]), x2: Math.min(b.x2, domain[1]) }))
    .filter((b) => b.x2 > b.x1)
    .map((b) => (
      <ReferenceArea
        key={b.key} x1={b.x1} x2={b.x2} fill={b.fill} fillOpacity={0.6} ifOverflow="hidden"
        {...(yAxisId ? { yAxisId } : {})}
        label={b.label ? { value: b.label, position: "insideBottomLeft", fill: b.labelColor || COLORS.inkSoft, fontSize: 11, fontWeight: 700, offset: 6 } : undefined}
      />
    ));

  if (kind === "health") {
    return (
      <ResponsiveContainer width="100%" height={height}>
        <ComposedChart data={data} margin={{ top: 10, right: 14, left: -4, bottom: 0 }}>
          {bandEls("total")}
          <CartesianGrid strokeDasharray="3 3" stroke={COLORS.line} vertical={false} />
          <XAxis {...xAxisProps} />
          <YAxis yAxisId="total" stroke={COLORS.accent} tick={{ fontSize: 11 }} width={34} />
          <YAxis yAxisId="mental" orientation="right" domain={[0, 5]} ticks={[0, 1, 2, 3, 4, 5]} stroke={COLORS.blue} tick={{ fontSize: 11 }} width={26} />
          <Line yAxisId="total" dataKey="total" stroke={COLORS.accent} strokeWidth={2.8} dot={makeDot(COLORS.accent)} activeDot={false} {...lineProps} />
          <Line yAxisId="mental" dataKey="mental" stroke={COLORS.blue} strokeWidth={2.8} dot={makeDot(COLORS.blue)} activeDot={false} {...lineProps} />
        </ComposedChart>
      </ResponsiveContainer>
    );
  }
  if (kind === "total") {
    return (
      <ResponsiveContainer width="100%" height={height}>
        <LineChart data={data} margin={{ top: 10, right: 14, left: -18, bottom: 0 }}>
          {bandEls()}
          <CartesianGrid strokeDasharray="3 3" stroke={COLORS.line} vertical={false} />
          <XAxis {...xAxisProps} />
          <YAxis stroke={COLORS.inkSoft} tick={{ fontSize: 11 }} />
          <Line dataKey="total" stroke={COLORS.accent} strokeWidth={2.8} dot={makeDot(COLORS.accent)} activeDot={false} {...lineProps} />
        </LineChart>
      </ResponsiveContainer>
    );
  }
  if (kind === "mental") {
    return (
      <ResponsiveContainer width="100%" height={height}>
        <LineChart data={data} margin={{ top: 10, right: 14, left: -18, bottom: 0 }}>
          {bandEls()}
          <CartesianGrid strokeDasharray="3 3" stroke={COLORS.line} vertical={false} />
          <XAxis {...xAxisProps} />
          <YAxis domain={[0, 5]} ticks={[0, 1, 2, 3, 4, 5]} stroke={COLORS.inkSoft} tick={{ fontSize: 11 }} />
          <Line dataKey="mental" stroke={COLORS.blue} strokeWidth={2.8} dot={makeDot(COLORS.blue)} activeDot={false} {...lineProps} />
        </LineChart>
      </ResponsiveContainer>
    );
  }
  if (kind === "stool") {
    return (
      <ResponsiveContainer width="100%" height={height}>
        <LineChart data={data} margin={{ top: 10, right: 14, left: -18, bottom: 0 }}>
          {bandEls()}
          {/* normal Bristol range (3–4) shaded so both extremes read as "off" at a glance */}
          <ReferenceArea y1={3} y2={4} fill={COLORS.accent} fillOpacity={0.12} ifOverflow="visible" />
          <CartesianGrid strokeDasharray="3 3" stroke={COLORS.line} vertical={false} />
          <XAxis {...xAxisProps} />
          <YAxis domain={[1, 7]} stroke={COLORS.inkSoft} tick={{ fontSize: 11 }} />
          <Line dataKey="stool" stroke={COLORS.gold} strokeWidth={2.8} dot={makeDot(COLORS.gold)} activeDot={false} {...lineProps} />
        </LineChart>
      </ResponsiveContainer>
    );
  }
  // events — discrete markers instead of a misleading continuous line; blank days mean nothing happened
  const vomitPts = data.filter((d) => d.vomit > 0).map((d) => ({ ...d, _row: 1 }));
  const stoolPts = data.filter((d) => d.stool <= 2 || d.stool >= 6).map((d) => ({ ...d, _row: 0 }));
  if (vomitPts.length === 0 && stoolPts.length === 0) {
    return (
      <div style={{ height, display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.inkSoft, fontSize: 12 }}>
        這段期間沒有嘔吐或便便異常紀錄
      </div>
    );
  }
  return (
    <ResponsiveContainer width="100%" height={height}>
      <ComposedChart data={data} margin={{ top: 4, right: 8, left: -4, bottom: 0 }}>
        {bandEls()}
        <CartesianGrid strokeDasharray="3 3" stroke={COLORS.line} vertical={false} />
        <XAxis {...xAxisProps} />
        <YAxis type="number" domain={[-1.1, 1.6]} ticks={[0, 1]} width={70} stroke={COLORS.inkSoft} tick={{ fontSize: 11 }}
          tickFormatter={(v) => (v === 1 ? "嘔吐" : v === 0 ? "便便異常" : "")} />
        <Scatter data={stoolPts} dataKey="_row" fill={COLORS.gold} shape={makeEventDot(COLORS.gold)} isAnimationActive={false} />
        <Scatter data={vomitPts} dataKey="_row" fill={COLORS.danger} shape={makeEventDot(COLORS.danger)} isAnimationActive={false} />
      </ComposedChart>
    </ResponsiveContainer>
  );
}

// ---------- Full-screen zoomable / pannable trend explorer (layer 2) — shared by all 4 metrics ----------
const ZOOM_MIN = 7;
const ZOOM_STEP = 5;

function ExpandedChartView({ chartData, bands, products, role, existingDates, onSaveRecord, onDeleteRecord, metric, initialDate, onOpenInHistory, onQuickAddProduct, onClose }) {
  const meta = CHART_META[metric] || CHART_META.health;
  const total = chartData.length;
  const initialIndex = initialDate ? chartData.findIndex((d) => d.date === initialDate) : -1;
  const defaultViewDays = Math.min(20, total || 20);

  const [viewDays, setViewDays] = useState(defaultViewDays);
  const [windowStart, setWindowStart] = useState(() => {
    if (initialIndex >= 0) return clamp(initialIndex - defaultViewDays / 2, 0, Math.max(0, total - defaultViewDays));
    return Math.max(0, total - defaultViewDays);
  });
  const [selectedDate, setSelectedDate] = useState(initialDate || null);
  const containerRef = useRef(null);
  const dragRef = useRef(null);
  const [dragging, setDragging] = useState(false);

  const maxStart = Math.max(0, total - viewDays);
  const startIdx = clamp(Math.round(windowStart), 0, maxStart);
  const windowed = chartData.slice(startIdx, startIdx + viewDays);
  const domain = paddedDomain(windowed);
  const rangeLabel = windowed.length ? `${windowed[0].date} ～ ${windowed[windowed.length - 1].date}` : "";

  const applyZoom = (nextViewDays) => {
    const capped = clamp(nextViewDays, ZOOM_MIN, Math.max(ZOOM_MIN, total));
    const center = windowStart + viewDays / 2;
    const nextMaxStart = Math.max(0, total - capped);
    const nextStart = clamp(center - capped / 2, 0, nextMaxStart);
    setViewDays(capped);
    setWindowStart(nextStart);
  };

  const DRAG_THRESHOLD = 6;
  const onPointerDown = (e) => {
    dragRef.current = { startX: e.clientX, startWindowStart: windowStart, moved: false, pointerId: e.pointerId, target: e.currentTarget };
  };
  const onPointerMove = (e) => {
    if (!dragRef.current || !containerRef.current) return;
    const deltaX = e.clientX - dragRef.current.startX;
    if (!dragRef.current.moved) {
      if (Math.abs(deltaX) < DRAG_THRESHOLD) return; // small movement — treat as a tap, don't hijack it
      dragRef.current.moved = true;
      setDragging(true);
      try { dragRef.current.target.setPointerCapture(dragRef.current.pointerId); } catch (err) { /* noop */ }
    }
    const width = containerRef.current.getBoundingClientRect().width || 300;
    const daysPerPixel = viewDays / width;
    const nextStart = clamp(dragRef.current.startWindowStart - deltaX * daysPerPixel, 0, maxStart);
    setWindowStart(nextStart);
  };
  const endDrag = () => { dragRef.current = null; setDragging(false); };

  const handlePointClick = (date) => setSelectedDate(date);
  const selectedRecord = selectedDate ? chartData.find((d) => d.date === selectedDate) : null;
  const selectedProduct = selectedRecord ? products.find((p) => p.id === selectedRecord.productId) : null;

  const zoomPresets = [7, 20, 30, 60];

  return (
    <div style={{ position: "fixed", inset: 0, background: COLORS.bg, zIndex: 60, display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", borderBottom: `1px solid ${COLORS.line}`, gap: 8 }}>
        <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft, display: "flex", alignItems: "center", gap: 6, fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", flexShrink: 0 }}>
          <X size={20} />關閉
        </button>
        <div style={{ textAlign: "center", minWidth: 0, flex: 1 }}>
          <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink, display: "flex", alignItems: "center", gap: 6, justifyContent: "center" }}>
            {meta.icon && <meta.icon size={15} color={COLORS.accent} />}
            {meta.short || meta.title}
          </div>
          <div style={{ fontSize: 11, color: COLORS.inkSoft }}>{rangeLabel}　（顯示 {windowed.length} 天）</div>
        </div>
        <div style={{ width: 56, flexShrink: 0 }} />
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: 16 }}>
        {meta.legend && <TrendLegend series={meta.legend} />}

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
          <button onClick={() => applyZoom(viewDays + ZOOM_STEP)} title="縮小（顯示更多天）" style={{
            width: 32, height: 32, borderRadius: 9, border: `1px solid ${COLORS.line}`, background: "#fff", cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.ink,
          }}><ZoomOut size={16} /></button>
          <button onClick={() => applyZoom(viewDays - ZOOM_STEP)} title="放大（顯示更少天）" style={{
            width: 32, height: 32, borderRadius: 9, border: `1px solid ${COLORS.line}`, background: "#fff", cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.ink,
          }}><ZoomIn size={16} /></button>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {zoomPresets.map((n) => (
              <button key={n} onClick={() => applyZoom(n)} style={{
                padding: "6px 11px", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer",
                border: `1px solid ${viewDays === n ? COLORS.accent : COLORS.line}`,
                background: viewDays === n ? COLORS.accentSoft : "#fff", color: viewDays === n ? COLORS.accent : COLORS.inkSoft,
              }}>{n}天</button>
            ))}
            <button onClick={() => applyZoom(total)} style={{
              padding: "6px 11px", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${viewDays >= total ? COLORS.accent : COLORS.line}`,
              background: viewDays >= total ? COLORS.accentSoft : "#fff", color: viewDays >= total ? COLORS.accent : COLORS.inkSoft,
            }}>全部</button>
          </div>
        </div>

        <Card style={{ padding: "12px 8px 4px" }}>
          <div
            ref={containerRef}
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            onPointerUp={endDrag}
            onPointerLeave={endDrag}
            style={{ cursor: dragging ? "grabbing" : "grab", touchAction: "pan-y" }}
          >
            <MetricChart data={windowed} bands={bands} domain={domain} height={260} onPointClick={handlePointClick} products={products} kind={meta.kind} />
          </div>
        </Card>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "10px 0 16px", gap: 10 }}>
          <button onClick={() => setWindowStart((w) => clamp(w - viewDays, 0, maxStart))} disabled={startIdx === 0} style={{
            display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", cursor: startIdx === 0 ? "default" : "pointer",
            color: startIdx === 0 ? COLORS.line : COLORS.inkSoft, fontSize: 12, fontWeight: 600, opacity: startIdx === 0 ? 0.5 : 1,
          }}><ChevronLeft size={14} />更早</button>
          <span style={{ fontSize: 11, color: COLORS.inkSoft }}>拖曳圖表可左右瀏覽・點資料點可查看與修改當日紀錄</span>
          <button onClick={() => setWindowStart((w) => clamp(w + viewDays, 0, maxStart))} disabled={startIdx >= maxStart} style={{
            display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", cursor: startIdx >= maxStart ? "default" : "pointer",
            color: startIdx >= maxStart ? COLORS.line : COLORS.inkSoft, fontSize: 12, fontWeight: 600, opacity: startIdx >= maxStart ? 0.5 : 1,
          }}>更近<ChevronRight size={14} /></button>
        </div>

        {selectedRecord && (
          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink }}>{selectedDate} 的紀錄</div>
              <button onClick={() => setSelectedDate(null)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkSoft }}><X size={18} /></button>
            </div>
            <DayPanelBody
              key={selectedDate}
              record={selectedRecord}
              product={selectedProduct}
              role={role}
              products={products}
              existingDates={existingDates}
              onSave={(rec) => { onSaveRecord(rec); setSelectedDate(null); }}
              onDelete={(id) => { onDeleteRecord(id); setSelectedDate(null); }}
              onOpenInHistory={onOpenInHistory}
              onQuickAddProduct={onQuickAddProduct}
            />
          </Card>
        )}
      </div>
    </div>
  );
}

// ---------- Dashboard ----------
function Dashboard({ records, products, role, existingDates, onSaveRecord, onDeleteRecord, onOpenInHistory, onQuickAddProduct }) {
  const [expanded, setExpanded] = useState(null); // { metric, date } | null

  const chartData = useMemo(() => {
    return [...records]
      .sort((a, b) => a.date.localeCompare(b.date))
      .map((r) => ({ ...r, ts: toTs(r.date), total: r.breakfast + r.dinner + r.bedtime }));
  }, [records]);

  const DAY = 86400000;
  const domain = useMemo(() => {
    const tss = chartData.map((d) => d.ts);
    products.forEach((p) => {
      tss.push(toTs(p.startDate));
      tss.push(p.endDate ? toTs(p.endDate) : toTs(todayStr()));
    });
    if (tss.length === 0) return [toTs(todayStr()), toTs(todayStr())];
    // Half-day padding so the first/last hollow dots aren't cut by the axis line
    return [Math.min(...tss) - DAY / 2, Math.max(...tss) + DAY / 2];
  }, [chartData, products]);

  if (chartData.length === 0) {
    return (
      <Card>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10, padding: "30px 0" }}>
          <PawIcon size={28} color={COLORS.line} />
          <div style={{ color: COLORS.inkSoft, fontSize: 14, textAlign: "center" }}>還沒有任何紀錄，先到「飲食日記」新增第一筆資料吧。</div>
        </div>
      </Card>
    );
  }

  // A band runs from the START of its first day to the END of its last day, so consecutive
  // products touch at midnight instead of leaving a one-day white gap between them.
  const latestTs = chartData.length ? chartData[chartData.length - 1].ts : toTs(todayStr());
  const bands = products.map((p) => {
    const c = swatch(p.color);
    const end = p.endDate ? toTs(p.endDate) + DAY : Math.max(latestTs, toTs(todayStr())) + DAY;
    return { x1: toTs(p.startDate), x2: end, fill: c.bg, labelColor: c.border, key: p.id, label: p.name };
  });

  const openExpanded = (metric, date) => setExpanded({ metric, date: date || null });

  const previewData = chartData.slice(-20);
  const previewDomain = paddedDomain(previewData);

  const renderChartCard = (metric, data, chartDomain, height = 180) => {
    const meta = CHART_META[metric];
    return (
      <Card key={metric}>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10, color: COLORS.ink, display: "flex", alignItems: "center", gap: 6 }}>
          {meta.icon && <meta.icon size={15} color={COLORS.accent} />}
          {meta.title}
        </div>
        {meta.legend && <TrendLegend series={meta.legend} />}
        <MetricChart data={data} bands={bands} domain={chartDomain} height={height} products={products} kind={meta.kind}
          onPointClick={(date) => openExpanded(metric, date)} />
        <Btn size="sm" variant="secondary" onClick={() => openExpanded(metric, null)} style={{ width: "100%", marginTop: 10 }}>
          <Maximize2 size={14} />展開查看（可縮放／拖曳瀏覽）
        </Btn>
      </Card>
    );
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {renderChartCard("health", previewData, previewDomain, 200)}
      {renderChartCard("events", chartData, domain, 140)}
      {renderChartCard("total", chartData, domain)}
      {renderChartCard("mental", chartData, domain)}
      {renderChartCard("stool", chartData, domain)}

      <Card>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10, color: COLORS.ink, display: "flex", alignItems: "center", gap: 6 }}>
          <LeafIcon size={15} color={COLORS.accent} />排除飲食時間軸
        </div>
        <Timeline products={products} />
      </Card>

      {expanded && (
        <ExpandedChartView
          chartData={chartData} bands={bands} products={products}
          role={role} existingDates={existingDates}
          onSaveRecord={onSaveRecord} onDeleteRecord={onDeleteRecord}
          metric={expanded.metric} initialDate={expanded.date}
          onOpenInHistory={onOpenInHistory ? (date) => { onOpenInHistory(date); setExpanded(null); } : null}
          onQuickAddProduct={onQuickAddProduct}
          onClose={() => setExpanded(null)}
        />
      )}
    </div>
  );
}

// ---------- History ----------
function flagsForRecord(r) {
  const flags = [];
  if (r.vomit > 0) flags.push({ key: "vomit", label: `嘔吐 ${r.vomit} 次`, color: COLORS.danger });
  if (r.mental <= 2) flags.push({ key: "mental", label: "精神偏低", color: COLORS.danger });
  if (r.stool <= 2) flags.push({ key: "stool", label: "便便偏硬", color: COLORS.gold });
  if (r.stool >= 6) flags.push({ key: "stool", label: "便便偏軟／腹瀉", color: COLORS.gold });
  return flags;
}

// Traffic-light colors so severity reads instantly without doing math on the number
const mentalColor = (v) => (v <= 2 ? COLORS.danger : v === 3 ? COLORS.gold : COLORS.accent);
const stoolColor = (v) => (v <= 2 || v >= 6 ? COLORS.danger : v === 5 ? COLORS.gold : COLORS.accent);

function StatPill({ tag, value, color }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11 }}>
      <span style={{ color: COLORS.inkSoft }}>{tag}</span>
      <span style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center", minWidth: 20, height: 20,
        padding: "0 6px", borderRadius: 10, background: color + "1F", color, fontSize: 12, fontWeight: 800,
      }}>{value}</span>
    </span>
  );
}

// One diary entry row — plain neutral border; only "abnormal" gets color, so red stays meaningful
function RecordRow({ r, onSelect, selectMode, selected, onToggleSelect }) {
  const total = r.breakfast + r.dinner + r.bedtime;
  const flagged = r._flags.length > 0;
  const note = [r.stress && `壓力：${r.stress}`, r.other && `備註：${r.other}`].filter(Boolean).join("　");
  return (
    <button onClick={() => (selectMode ? onToggleSelect(r.id) : onSelect(r.date))} style={{
      display: "flex", flexDirection: "column", width: "100%",
      textAlign: "left", padding: "10px 12px", borderRadius: 10,
      border: `1.5px solid ${selectMode && selected ? COLORS.accent : flagged ? COLORS.danger : COLORS.line}`,
      background: flagged ? COLORS.dangerSoft : "#fff", cursor: "pointer",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
          {selectMode && (
            <div style={{
              width: 18, height: 18, borderRadius: 5, flexShrink: 0,
              border: `2px solid ${selected ? COLORS.accent : COLORS.line}`, background: selected ? COLORS.accent : "#fff",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>{selected && <Check size={12} color="#fff" />}</div>
          )}
          <span style={{ fontWeight: 700, fontSize: 13, color: COLORS.ink }}>{r.date}</span>
          {flagged && (
            <span style={{
              background: COLORS.danger, color: "#fff", fontSize: 10, fontWeight: 700,
              padding: "2px 7px", borderRadius: 20, display: "inline-flex", alignItems: "center", gap: 3, flexShrink: 0,
            }}><AlertCircle size={10} />異常</span>
          )}
          {r.stress && <MessageSquare size={12} color={COLORS.gold} style={{ flexShrink: 0 }} />}
          {r.other && <JournalIcon size={12} color={COLORS.blue} style={{ flexShrink: 0 }} />}
        </div>
        <div style={{ fontWeight: 700, fontSize: 13, color: COLORS.ink, flexShrink: 0 }}>{total} g</div>
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 8, marginTop: 6, flexWrap: "wrap" }}>
        <StatPill tag="精神" value={r.mental} color={mentalColor(r.mental)} />
        <StatPill tag="便便" value={r.stool} color={stoolColor(r.stool)} />
        {r.vomit > 0 && <StatPill tag="吐" value={r.vomit} color={COLORS.danger} />}
      </div>

      {note && (
        <div style={{
          display: "flex", alignItems: "flex-start", gap: 5, marginTop: 6,
          fontSize: 12, color: COLORS.ink, background: flagged ? "#fff" : COLORS.accentSoft,
          borderRadius: 8, padding: "6px 8px",
        }}>
          <MessageSquare size={13} color={COLORS.accent} style={{ marginTop: 1, flexShrink: 0 }} />
          <span style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{note}</span>
        </div>
      )}

      {flagged && (
        <div style={{ fontSize: 11, color: COLORS.danger, fontWeight: 600, marginTop: 6 }}>
          {r._flags.map((f) => f.label).join("・")}
        </div>
      )}
    </button>
  );
}

function History({ records, products, onSelect, onDeleteMany, onConfirm, role, existingDates, onAddRecord, onQuickAddProduct, onAddProduct, onEditProduct, onLoadSample }) {
  const [search, setSearch] = useState("");
  const [onlyFlagged, setOnlyFlagged] = useState(false);
  const [manualOpen, setManualOpen] = useState({}); // productId -> explicit true/false, overrides the default
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState(new Set());
  const [addOpen, setAddOpen] = useState(false);

  const sorted = useMemo(() => [...records].sort((a, b) => b.date.localeCompare(a.date)), [records]);
  const withFlags = useMemo(() => sorted.map((r) => ({ ...r, _flags: flagsForRecord(r) })), [sorted]);
  const flaggedCount = withFlags.filter((r) => r._flags.length > 0).length;
  const searchActive = search.trim().length > 0 || onlyFlagged;

  // Group by product period — the period/average/abnormal-count is stated once in the
  // header instead of repeating a colored frame on every single card underneath it.
  const groups = useMemo(() => {
    const map = new Map();
    withFlags.forEach((r) => {
      const key = r.productId || "__none__";
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    });
    const arr = Array.from(map.entries()).map(([productId, recs]) => {
      const product = products.find((x) => x.id === productId);
      const dates = recs.map((r) => r.date).sort();
      const avg = Math.round(recs.reduce((s, r) => s + r.breakfast + r.dinner + r.bedtime, 0) / recs.length);
      const groupFlagged = recs.filter((r) => r._flags.length > 0).length;
      const visible = recs
        .filter((r) => r.date.includes(search))
        .filter((r) => !onlyFlagged || r._flags.length > 0)
        .sort((a, b) => b.date.localeCompare(a.date));
      return { productId, product, startDate: dates[0], endDate: dates[dates.length - 1], avg, groupFlagged, count: recs.length, visible };
    });
    arr.sort((a, b) => b.endDate.localeCompare(a.endDate));
    return arr.filter((g) => g.visible.length > 0);
  }, [withFlags, products, search, onlyFlagged]);

  const isOpen = (productId, idx) => (manualOpen.hasOwnProperty(productId) ? manualOpen[productId] : idx === 0 || searchActive);
  const toggle = (productId, idx) => setManualOpen((prev) => ({ ...prev, [productId]: !isOpen(productId, idx) }));

  const allVisibleIds = useMemo(() => groups.flatMap((g) => g.visible.map((r) => r.id)), [groups]);
  const toggleSelect = (id) => setSelected((prev) => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  const exitSelectMode = () => { setSelectMode(false); setSelected(new Set()); };
  const toggleSelectAll = () => {
    setSelected((prev) => (prev.size === allVisibleIds.length ? new Set() : new Set(allVisibleIds)));
  };
  const requestBulkDelete = () => {
    const n = selected.size;
    onConfirm({
      message: `確定要刪除選取的 ${n} 筆紀錄嗎？這個動作無法復原。`,
      onYes: () => { onDeleteMany(Array.from(selected)); exitSelectMode(); },
    });
  };

  return (
    <Card>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink, display: "flex", alignItems: "center", gap: 6 }}>
          <JournalIcon size={15} color={COLORS.accent} />飲食日記
        </div>
        <div style={{ display: "flex", gap: 6, flexShrink: 0, flexWrap: "wrap", justifyContent: "flex-end" }}>
          {role === "owner" && !selectMode && (
            <Btn size="sm" onClick={() => setAddOpen(true)}><Plus size={13} />新增紀錄</Btn>
          )}
          {role === "owner" && !selectMode && onAddProduct && (
            <Btn size="sm" variant="secondary" onClick={onAddProduct}><LeafIcon size={13} color={COLORS.accent} />新增產品</Btn>
          )}
          {role === "owner" && (
            <button onClick={() => (selectMode ? exitSelectMode() : setSelectMode(true))} style={{
              display: "flex", alignItems: "center", gap: 5, padding: "5px 10px", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${selectMode ? COLORS.danger : COLORS.line}`,
              background: selectMode ? COLORS.dangerSoft : "#fff", color: selectMode ? COLORS.danger : COLORS.inkSoft,
            }}>
              <Trash2 size={13} />{selectMode ? "取消選取" : "刪除部分資料"}
            </button>
          )}
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Search size={16} color={COLORS.inkSoft} />
        <input placeholder="搜尋日期，例如 2026-08" value={search} onChange={(e) => setSearch(e.target.value)} style={{ ...inputStyle, border: "none", padding: "4px 0" }} />
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontSize: 12, color: COLORS.inkSoft }}>
          共 {sorted.length} 天紀錄
          {flaggedCount > 0 && <span style={{ color: COLORS.danger, fontWeight: 600 }}>・{flaggedCount} 天有異常需留意</span>}
        </div>
        {flaggedCount > 0 && !selectMode && (
          <button onClick={() => setOnlyFlagged((v) => !v)} style={{
            display: "flex", alignItems: "center", gap: 5, padding: "5px 11px", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer",
            border: `1px solid ${onlyFlagged ? COLORS.danger : COLORS.line}`,
            background: onlyFlagged ? COLORS.dangerSoft : "#fff", color: onlyFlagged ? COLORS.danger : COLORS.inkSoft,
          }}><AlertCircle size={13} />只看異常</button>
        )}
      </div>

      {selectMode && (
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 14,
          padding: "10px 12px", borderRadius: 10, background: COLORS.accentSoft,
        }}>
          <button onClick={toggleSelectAll} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.accent, fontSize: 12, fontWeight: 600 }}>
            {selected.size === allVisibleIds.length && allVisibleIds.length > 0 ? "取消全選" : "全選目前列表"}
          </button>
          <Btn size="sm" variant="danger" onClick={requestBulkDelete} disabled={selected.size === 0}>
            <Trash2 size={13} />刪除已選（{selected.size}）
          </Btn>
        </div>
      )}

      {groups.length === 0 && records.length === 0 && (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10, padding: "24px 0" }}>
          <PawIcon size={28} color={COLORS.line} />
          <div style={{ color: COLORS.inkSoft, fontSize: 13, textAlign: "center" }}>還沒有任何紀錄。點上方「新增紀錄」開始記錄。</div>
          {onLoadSample && (
            <>
              <Btn size="sm" variant="secondary" onClick={onLoadSample}>載入範例資料看看效果</Btn>
              <div style={{ fontSize: 11, color: COLORS.inkSoft, textAlign: "center", maxWidth: 280 }}>
                範例只用來預覽，之後可以用「刪除部分資料」→「全選目前列表」一次清掉。
              </div>
            </>
          )}
        </div>
      )}
      {groups.length === 0 && records.length > 0 && (
        <div style={{ color: COLORS.inkSoft, fontSize: 13, padding: "20px 0", textAlign: "center" }}>沒有符合的紀錄。</div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {groups.map((g, idx) => {
          const c = swatch(g.product?.color);
          const open = isOpen(g.productId, idx);
          return (
            <div key={g.productId}>
              <div style={{
                display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%",
                borderRadius: 10, border: `1px solid ${COLORS.line}`, background: c.bg,
              }}>
                <button onClick={() => toggle(g.productId, idx)} style={{
                  flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 8,
                  padding: "10px 12px", background: "none", border: "none", cursor: "pointer", textAlign: "left",
                }}>
                  <ChevronDown size={15} color={COLORS.ink} style={{ transform: open ? "rotate(0deg)" : "rotate(-90deg)", transition: "transform .15s", flexShrink: 0 }} />
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: COLORS.ink }}>{g.product?.name || "未指定產品"}</div>
                    <div style={{ fontSize: 11, color: COLORS.inkSoft }}>
                      {g.startDate === g.endDate ? g.startDate : `${g.startDate} ～ ${g.endDate}`}　平均 {g.avg}g／天
                    </div>
                  </div>
                </button>
                <div style={{ display: "flex", alignItems: "center", gap: 6, paddingRight: 10, flexShrink: 0 }}>
                  {g.groupFlagged > 0 && (
                    <span style={{
                      background: COLORS.danger, color: "#fff", fontSize: 11, fontWeight: 700,
                      padding: "3px 8px", borderRadius: 20,
                    }}>{g.groupFlagged} 天異常</span>
                  )}
                  {role === "owner" && onEditProduct && g.product && (
                    <button onClick={() => onEditProduct(g.product)} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: COLORS.inkSoft, display: "flex" }}>
                      <Pencil size={14} />
                    </button>
                  )}
                </div>
              </div>

              {open && (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 6, paddingLeft: 4 }}>
                  {g.visible.map((r) => (
                    <RecordRow key={r.id} r={r} onSelect={onSelect}
                      selectMode={selectMode} selected={selected.has(r.id)} onToggleSelect={toggleSelect} />
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {addOpen && (
        <Modal title="新增紀錄" onClose={() => setAddOpen(false)}>
          <RecordForm
            products={products}
            existingDates={existingDates}
            onSave={(rec) => { onAddRecord(rec); setAddOpen(false); }}
            onCancel={() => setAddOpen(false)}
            onQuickAddProduct={onQuickAddProduct}
          />
        </Modal>
      )}
    </Card>
  );
}

// ---------- Export ----------
function ExportPanel({ records, products, petName }) {
  const [range, setRange] = useState("7");
  const [customStart, setCustomStart] = useState(todayStr());
  const [customEnd, setCustomEnd] = useState(todayStr());
  const [warning, setWarning] = useState("");
  const [notice, setNotice] = useState("");

  const COLS = ["日期", "產品", "早餐(g)", "晚餐(g)", "睡前(g)", "總量(g)", "精神分數", "便便分數", "嘔吐", "壓力事件", "其他"];

  const getFilteredRows = () => {
    let filtered = [...records];
    // Anchor "recent" ranges to the most recent entry in the diary itself, not the device's
    // real-world today — otherwise "最近7天" silently returns nothing once today drifts past
    // the last recorded date (e.g. demo data, or simply not logging today yet).
    const latestDate = records.length ? records.reduce((m, r) => (r.date > m ? r.date : m), records[0].date) : todayStr();
    const anchor = toTs(latestDate);
    if (range === "7") filtered = filtered.filter((r) => toTs(r.date) >= anchor - 6 * 86400000);
    else if (range === "30") filtered = filtered.filter((r) => toTs(r.date) >= anchor - 29 * 86400000);
    else if (range === "custom") filtered = filtered.filter((r) => toTs(r.date) >= toTs(customStart) && toTs(r.date) <= toTs(customEnd));
    filtered.sort((a, b) => a.date.localeCompare(b.date));
    return filtered.map((r) => {
      const p = products.find((x) => x.id === r.productId);
      return {
        "日期": r.date, "產品": p?.name || "", "早餐(g)": r.breakfast, "晚餐(g)": r.dinner,
        "睡前(g)": r.bedtime, "總量(g)": r.breakfast + r.dinner + r.bedtime,
        "精神分數": r.mental, "便便分數": r.stool, "嘔吐": r.vomit, "壓力事件": r.stress || "", "其他": r.other || "",
      };
    });
  };

  const currentLabel = () => (range === "7" ? "最近7天" : range === "30" ? "最近30天" : range === "all" ? "全部" : `${customStart}_${customEnd}`);

  // Most reliable path on mobile: copy as tab-separated text, then paste straight into a
  // blank sheet in Excel / Numbers / Google Sheets — this needs no download, no share sheet,
  // no file system at all, so it sidesteps every in-app-browser quirk above.
  const doCopy = async () => {
    setWarning("");
    setNotice("");
    const rows = getFilteredRows();
    if (rows.length === 0) {
      setWarning("這個區間內沒有任何紀錄，沒有東西可以複製。請換一個日期區間試試看。");
      return;
    }
    const clean = (v) => String(v ?? "").replace(/[\t\r\n]+/g, " ");
    const tsv = [COLS.join("\t"), ...rows.map((r) => COLS.map((c) => clean(r[c])).join("\t"))].join("\n");
    try {
      await navigator.clipboard.writeText(tsv);
      setNotice("已複製表格內容！打開 Excel／Numbers／Google 試算表，新增一張空白表格，直接貼上即可自動分好欄位。");
    } catch (e) {
      setWarning("複製失敗，這台裝置可能不允許網頁存取剪貼簿。可以改用下面的「下載 .xlsx」試試看。");
    }
  };

  // Some in-app browsers (e.g. inside chat apps) don't honor <a download>, and instead
  // navigate to the file and render its raw bytes as text — which is exactly the "亂碼"
  // page this was producing. Try the mobile share sheet first, then a classic download,
  // then fall back to opening the file in a new tab as a last resort.
  const deliverFile = async (blob, filename, mime) => {
    try {
      if (navigator.canShare) {
        const file = new File([blob], filename, { type: mime });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          return "shared";
        }
      }
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled"; // user closed the share sheet
    }
    try {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
      return "downloaded";
    } catch (e) {
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank", "noopener");
      return "opened";
    }
  };

  const doExport = async () => {
    setWarning("");
    setNotice("");
    const rows = getFilteredRows();
    if (rows.length === 0) {
      setWarning("這個區間內沒有任何紀錄，沒有產生檔案。請換一個日期區間試試看。");
      return;
    }
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [{ wch: 11 }, { wch: 14 }, { wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 9 }, { wch: 7 }, { wch: 20 }, { wch: 20 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "排除飲食紀錄");
    const filename = `${petName || "排除飲食"}紀錄_${currentLabel()}.xlsx`;
    const mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([wbout], { type: mime });

    const result = await deliverFile(blob, filename, mime);
    if (result === "opened") setNotice("已在新分頁開啟檔案。如果畫面顯示的是亂碼，請點瀏覽器選單裡的「下載」或「儲存檔案」。");
    else if (result === "shared") setNotice("已開啟分享／儲存選單，請選擇「儲存至檔案」。");
  };

  const opt = (val, label) => (
    <button onClick={() => { setRange(val); setWarning(""); setNotice(""); }} style={{
      padding: "8px 14px", borderRadius: 9, fontSize: 13, fontWeight: 600, cursor: "pointer",
      border: `1px solid ${range === val ? COLORS.accent : COLORS.line}`,
      background: range === val ? COLORS.accentSoft : "#fff", color: range === val ? COLORS.accent : COLORS.ink,
    }}>{label}</button>
  );

  return (
    <Card>
      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12, color: COLORS.ink, display: "flex", alignItems: "center", gap: 6 }}>
        <Download size={15} color={COLORS.accent} />匯出 Excel
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        {opt("7", "最近 7 天")}{opt("30", "最近 30 天")}{opt("all", "整個排除飲食期間")}{opt("custom", "自訂日期")}
      </div>
      {range === "custom" && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
          <input type="date" value={customStart} onChange={(e) => { setCustomStart(e.target.value); setWarning(""); setNotice(""); }} style={inputStyle} />
          <input type="date" value={customEnd} onChange={(e) => { setCustomEnd(e.target.value); setWarning(""); setNotice(""); }} style={inputStyle} />
        </div>
      )}
      {warning && (
        <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: COLORS.dangerSoft, color: COLORS.danger, padding: "10px 12px", borderRadius: 10, fontSize: 13, marginBottom: 12 }}>
          <AlertCircle size={16} style={{ flexShrink: 0, marginTop: 1 }} />
          <span>{warning}</span>
        </div>
      )}
      {notice && (
        <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: COLORS.accentSoft, color: COLORS.accent, padding: "10px 12px", borderRadius: 10, fontSize: 13, marginBottom: 12 }}>
          <AlertCircle size={16} style={{ flexShrink: 0, marginTop: 1 }} />
          <span>{notice}</span>
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <Btn onClick={doCopy}><JournalIcon size={15} color="#fff" />複製表格（貼到 Excel／Numbers 最穩）</Btn>
        <Btn variant="secondary" onClick={doExport}><Download size={15} />下載 .xlsx 檔案</Btn>
      </div>
    </Card>
  );
}

// ---------- Sample data (preview only; shown only when the diary is empty) ----------
function buildSampleData() {
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
  const today = new Date(todayStr() + "T00:00:00");
  const days = 26;
  const start = addDays(today, -(days - 1));
  const switchDate = addDays(today, -(days - 15)); // switch foods on day 15
  const p1 = { id: "sample-p1", name: "GI32", startDate: start, endDate: addDays(today, -(days - 14)), color: "teal" };
  const p2 = { id: "sample-p2", name: "新處方飼料", startDate: switchDate, endDate: null, color: "gold" };
  const products = [p1, p2];

  const records = [];
  for (let i = 0; i < days; i++) {
    const date = addDays(today, -(days - 1) + i);
    const onNewFood = date >= switchDate;
    const daysSinceSwitch = onNewFood ? i - 14 : -1;

    // appetite dips right after the switch, then recovers
    let base = 70;
    if (onNewFood && daysSinceSwitch <= 3) base = 50 + daysSinceSwitch * 5;
    else if (onNewFood) base = 65 + Math.min(daysSinceSwitch - 3, 8);

    const jitter = () => Math.round((Math.random() - 0.5) * 10);
    const breakfast = Math.max(0, Math.round(base * 0.35 + jitter()));
    const dinner = Math.max(0, Math.round(base * 0.4 + jitter()));
    const bedtime = Math.max(0, Math.round(base * 0.25 + jitter()));

    let mental = onNewFood && daysSinceSwitch >= 0 && daysSinceSwitch <= 2 ? 2 : 4;
    if (Math.random() < 0.15) mental = Math.max(0, mental - 1);

    let stool = onNewFood && daysSinceSwitch >= 0 && daysSinceSwitch <= 3 ? 6 : 4;
    if (Math.random() < 0.2) stool = Math.min(7, Math.max(1, stool + (Math.random() < 0.5 ? -1 : 1)));

    const vomit = (onNewFood && daysSinceSwitch >= 0 && daysSinceSwitch <= 2 && Math.random() < 0.4) ? 1 : (Math.random() < 0.05 ? 1 : 0);
    const stress = i === 5 ? "有客人來訪，比較緊張" : (i === 16 ? "打雷，躲到床底下" : "");
    const other = i === 20 ? "今天特別黏人" : "";

    records.push({
      id: `sample-r-${i}`, date, productId: onNewFood ? p2.id : p1.id,
      breakfast, dinner, bedtime, mental, stool, vomit, other, stress,
    });
  }
  return { products, records };
}

// ---------- Main App ----------
function App() {
  const [screen, setScreen] = useState("landing"); // 'landing' | 'pets' | 'app'
  const [role, setRole] = useState("owner"); // 'owner' | 'vet'
  const [tab, setTab] = useState(null); // null = layer-2 hub menu; a key = layer-3 section detail
  const [pets, setPets] = useState([]);
  const [petId, setPetId] = useState(null);
  const [products, setProducts] = useState([]);
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null); // {type:'addProduct'|'editProduct'|'dayPanel', payload}
  const [ownerPin, setOwnerPin] = useState(""); // "" = no PIN protection set
  const [pinPrompt, setPinPrompt] = useState(false); // true while entering PIN to unlock owner mode
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState("");
  const [pinSettingsOpen, setPinSettingsOpen] = useState(false);
  const [confirmDialog, setConfirmDialog] = useState(null); // { message, onYes } — replaces window.confirm, which the sandbox can silently block
  const [petModal, setPetModal] = useState(null); // { mode:'add'|'edit', pet }

  useEffect(() => {
    (async () => { setOwnerPin(await loadPin()); })();
  }, []);

  useEffect(() => {
    (async () => {
      const list = await loadPetsWithMigration();
      setPets(list);
      setLoading(false);
    })();
  }, []);

  // Each pet keeps its own records and products, so switching pets reloads that pet's data
  const [petLoading, setPetLoading] = useState(false);
  useEffect(() => {
    if (!petId) { setProducts([]); setRecords([]); return; }
    let cancelled = false;
    setPetLoading(true);
    (async () => {
      const [p, r] = await Promise.all([loadKey(productsKey(petId)), loadKey(recordsKey(petId))]);
      if (!cancelled) { setProducts(p); setRecords(r); setPetLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [petId]);

  const persistPets = useCallback(async (next) => { setPets(next); await saveKey(KEY_PETS, next); }, []);
  const persistRecords = useCallback(async (next) => { setRecords(next); if (petId) await saveKey(recordsKey(petId), next); }, [petId]);
  const persistProducts = useCallback(async (next) => { setProducts(next); if (petId) await saveKey(productsKey(petId), next); }, [petId]);

  const currentPet = pets.find((p) => p.id === petId) || null;
  const savePet = async (pet) => {
    const exists = pets.some((p) => p.id === pet.id);
    await persistPets(exists ? pets.map((p) => (p.id === pet.id ? pet : p)) : [...pets, pet]);
    setPetModal(null);
  };
  const deletePet = async (id) => {
    if (pets.length <= 1) return; // always keep at least one pet
    await persistPets(pets.filter((p) => p.id !== id));
    try { await window.storage.delete(productsKey(id), true); } catch (e) { /* noop */ }
    try { await window.storage.delete(recordsKey(id), true); } catch (e) { /* noop */ }
    if (petId === id) { setPetId(null); setScreen("pets"); }
    setPetModal(null);
  };
  // After picking a role: go straight in if there's only one pet, otherwise ask which pet
  const enterAs = (r) => {
    setRole(r); setTab(null);
    if (pets.length === 1) { setPetId(pets[0].id); setScreen("app"); }
    else { setScreen("pets"); }
  };
  const choosePet = (id) => { setPetId(id); setTab(null); setScreen("app"); };

  const saveRecord = (rec) => {
    const exists = records.some((r) => r.id === rec.id);
    const next = exists ? records.map((r) => (r.id === rec.id ? rec : r)) : [...records, rec];
    persistRecords(next);
    setModal(null);
  };
  const deleteRecord = (id) => { persistRecords(records.filter((r) => r.id !== id)); setModal(null); };
  const saveProduct = (prod) => {
    const exists = products.some((p) => p.id === prod.id);
    const next = exists ? products.map((p) => (p.id === prod.id ? prod : p)) : [...products, prod];
    persistProducts(next);
    setModal(null);
  };
  const deleteProduct = (id) => { persistProducts(products.filter((p) => p.id !== id)); setModal(null); };
  const deleteRecords = (ids) => { persistRecords(records.filter((r) => !ids.includes(r.id))); };
  // startDate defaults to the record being written, so a product added while back-filling an
  // earlier day covers that day on the charts instead of starting "today"
  const quickAddProduct = (name, startDate) => {
    const prod = { id: uid(), name: name.trim(), startDate: startDate || todayStr(), endDate: null, color: PALETTE[products.length % PALETTE.length].key };
    persistProducts([...products, prod]);
    return prod;
  };
  const loadSampleData = () => {
    const { products: sp, records: sr } = buildSampleData();
    persistProducts(sp);
    persistRecords(sr);
  };

  const openDayByDate = (date) => {
    const rec = records.find((r) => r.date === date);
    if (!rec) return;
    setModal({ type: "dayPanel", payload: rec });
  };
  const openInHistory = (date) => { setTab("history"); openDayByDate(date); };

  const handleSelectRole = (r) => {
    if (r === "owner" && ownerPin) {
      setPinInput(""); setPinError(""); setPinPrompt(true);
    } else {
      enterAs(r);
    }
  };
  const submitPin = () => {
    if (pinInput === ownerPin) {
      setPinPrompt(false); setPinInput(""); setPinError("");
      enterAs("owner");
    } else {
      setPinError("PIN 不正確，請再試一次");
      setPinInput("");
    }
  };
  const setNewPin = async (pin) => { await savePin(pin); setOwnerPin(pin); };
  const removePin = async () => { await clearPin(); setOwnerPin(""); };

  const existingDates = records.map((r) => r.date);
  const TAB_META = {
    dashboard: { label: "趨勢總覽", Icon: HeartIcon, desc: "圖表與健康趨勢", bg: COLORS.accentSoft },
    history: { label: "飲食日記", Icon: JournalIcon, desc: "新增紀錄、管理產品", bg: COLORS.blueSoft },
    export: { label: "匯出", Icon: Download, desc: "匯出 Excel／複製表格", bg: "#F3DEE0" },
  };
  const tabs = role === "owner"
    ? [["dashboard", "趨勢總覽"], ["history", "飲食日記"], ["export", "匯出"]]
    : [["dashboard", "趨勢總覽"], ["history", "飲食日記"], ["export", "匯出"]];

  useEffect(() => { if (role === "vet" && tab && !["dashboard", "history", "export"].includes(tab)) setTab(null); }, [role]); // eslint-disable-line

  if (screen === "landing") {
    return (
      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", background: COLORS.bg, minHeight: "100%", color: COLORS.ink }}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
          * { box-sizing: border-box; }
        `}</style>
        {pinPrompt ? (
          <PinPromptScreen
            value={pinInput} onChange={setPinInput} error={pinError}
            onSubmit={submitPin} onCancel={() => { setPinPrompt(false); setPinInput(""); setPinError(""); }}
          />
        ) : (
          <LandingScreen onEnter={handleSelectRole} pinSet={!!ownerPin} />
        )}
      </div>
    );
  }

  if (screen === "pets") {
    return (
      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", background: COLORS.bg, minHeight: "100%", color: COLORS.ink }}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
          * { box-sizing: border-box; }
          input, select, textarea { font-family: inherit; }
        `}</style>
        <PetPickerScreen
          pets={pets} role={role} onPick={choosePet}
          onAdd={role === "owner" ? () => setPetModal({ mode: "add" }) : undefined}
          onEdit={role === "owner" ? (p) => setPetModal({ mode: "edit", pet: p }) : undefined}
          onBack={() => setScreen("landing")}
        />
        {petModal && (
          <Modal title={petModal.mode === "add" ? "新增記錄對象" : "編輯記錄對象"} onClose={() => setPetModal(null)}>
            <PetForm
              initial={petModal.pet}
              canDelete={pets.length > 1}
              onSave={savePet}
              onDelete={(id) => setConfirmDialog({ message: `確定要刪除「${petModal.pet?.name}」和牠的所有紀錄嗎？無法復原。`, onYes: () => deletePet(id) })}
              onCancel={() => setPetModal(null)}
            />
          </Modal>
        )}
        {confirmDialog && (
          <Modal title="請確認" onClose={() => setConfirmDialog(null)}>
            <div style={{ fontSize: 14, color: COLORS.ink, lineHeight: 1.6, marginBottom: 20 }}>{confirmDialog.message}</div>
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
              <Btn variant="ghost" onClick={() => setConfirmDialog(null)}>取消</Btn>
              <Btn variant="danger" onClick={() => { confirmDialog.onYes(); setConfirmDialog(null); }}>確定</Btn>
            </div>
          </Modal>
        )}
      </div>
    );
  }

  return (
    <div style={{
      fontFamily: "'IBM Plex Sans', sans-serif", background: COLORS.bg, minHeight: "100%", color: COLORS.ink,
      backgroundImage: `url("${PAW_PATTERN_URL}")`, backgroundRepeat: "repeat",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        input, select, textarea { font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: 2px solid ${COLORS.accent}44; border-color: ${COLORS.accent}; }
      `}</style>

      <div style={{ maxWidth: 720, margin: "0 auto", padding: "18px 16px 40px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6, gap: 8 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
              <PawIcon size={18} color={COLORS.accent} />
              <h1 style={{ fontFamily: "'Source Serif 4', serif", fontSize: 24, margin: 0, color: COLORS.ink }}>
                {currentPet ? `${currentPet.name}的排除飲食日記` : "排除飲食日記"}
              </h1>
            </div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
              {role === "owner" ? "主人模式" : "醫師模式（唯讀）"}・資料同步於雲端
            </div>
          </div>
          <div style={{ display: "flex", gap: 6, flexShrink: 0, flexWrap: "wrap", justifyContent: "flex-end" }}>
            <button onClick={() => { setScreen("pets"); setTab(null); }} title="切換記錄對象" style={{
              display: "flex", alignItems: "center", gap: 5, background: "#fff", border: `1px solid ${COLORS.line}`,
              borderRadius: 9, padding: "7px 10px", cursor: "pointer", color: COLORS.inkSoft, fontSize: 12, fontWeight: 600,
            }}><PawIcon size={13} color={COLORS.inkSoft} />切換對象</button>
            {role === "owner" && (
              <button onClick={() => setPinSettingsOpen(true)} title="PIN 保護設定" style={{
                display: "flex", alignItems: "center", gap: 5, background: "#fff", border: `1px solid ${COLORS.line}`,
                borderRadius: 9, padding: "7px 10px", cursor: "pointer", color: COLORS.inkSoft, fontSize: 12, fontWeight: 600,
              }}><LockIcon size={14} color={ownerPin ? COLORS.accent : COLORS.inkSoft} /></button>
            )}
            <button onClick={() => { setScreen("landing"); setTab(null); }} style={{
              display: "flex", alignItems: "center", gap: 5, background: "#fff", border: `1px solid ${COLORS.line}`,
              borderRadius: 9, padding: "7px 12px", cursor: "pointer", color: COLORS.inkSoft, fontSize: 12, fontWeight: 600,
            }}><Home size={14} />切換介面</button>
          </div>
        </div>

        {loading || petLoading ? (
          <div style={{ textAlign: "center", padding: 40, color: COLORS.inkSoft }}>載入中…</div>
        ) : tab === null ? (
          // ---- Layer 2: hub menu — hand-drawn icon tiles ----
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            {tabs.map(([key]) => {
              const meta = TAB_META[key];
              return (
                <button
                  key={key}
                  onClick={() => setTab(key)}
                  style={{
                    display: "flex", flexDirection: "column", alignItems: "center", gap: 8,
                    padding: "22px 12px", borderRadius: 18, border: `1px solid ${COLORS.line}`,
                    background: "#fff", boxShadow: COLORS.shadow, cursor: "pointer", textAlign: "center",
                  }}
                >
                  <div style={{ width: 52, height: 52, borderRadius: 16, background: meta.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <meta.Icon size={26} color={COLORS.accent} />
                  </div>
                  <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink }}>{meta.label}</div>
                  <div style={{ fontSize: 11, color: COLORS.inkSoft }}>{meta.desc}</div>
                </button>
              );
            })}
          </div>
        ) : (
          // ---- Layer 3: section detail, with a way back to the hub ----
          <div>
            <button onClick={() => setTab(null)} style={{
              display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", cursor: "pointer",
              color: COLORS.inkSoft, fontSize: 13, fontWeight: 600, padding: 0, marginBottom: 14,
            }}>
              <ChevronLeft size={16} />返回
            </button>

            {tab === "dashboard" && (
              <Dashboard
                records={records} products={products}
                role={role} existingDates={existingDates}
                onSaveRecord={saveRecord} onDeleteRecord={deleteRecord}
                onOpenInHistory={openInHistory} onQuickAddProduct={quickAddProduct}
              />
            )}
            {tab === "history" && (
              <History
                records={records} products={products} onSelect={openDayByDate}
                onDeleteMany={deleteRecords} onConfirm={setConfirmDialog}
                role={role} existingDates={existingDates}
                onAddRecord={role === "owner" ? saveRecord : undefined}
                onQuickAddProduct={role === "owner" ? quickAddProduct : undefined}
                onAddProduct={role === "owner" ? () => setModal({ type: "addProduct" }) : undefined}
                onEditProduct={role === "owner" ? (p) => setModal({ type: "editProduct", payload: p }) : undefined}
                onLoadSample={role === "owner" ? loadSampleData : undefined}
              />
            )}
            {tab === "export" && <ExportPanel records={records} products={products} petName={currentPet?.name} />}
          </div>
        )}
      </div>

      {modal?.type === "addProduct" && (
        <Modal title="新增產品" onClose={() => setModal(null)}>
          <ProductForm onSave={saveProduct} onCancel={() => setModal(null)} />
        </Modal>
      )}
      {modal?.type === "editProduct" && (
        <Modal title="編輯產品" onClose={() => setModal(null)}>
          <ProductForm initial={modal.payload} onSave={saveProduct} onCancel={() => setModal(null)} onDelete={deleteProduct} />
        </Modal>
      )}
      {modal?.type === "dayPanel" && (
        <Modal title={`${modal.payload.date} 紀錄`} onClose={() => setModal(null)}>
          <DayPanelBody
            key={modal.payload.date}
            record={modal.payload}
            product={products.find((p) => p.id === modal.payload.productId)}
            role={role}
            products={products}
            existingDates={existingDates}
            onSave={(rec) => { saveRecord(rec); }}
            onDelete={(id) => { deleteRecord(id); }}
            onQuickAddProduct={quickAddProduct}
          />
        </Modal>
      )}

      {pinSettingsOpen && (
        <Modal title="PIN 保護設定" onClose={() => setPinSettingsOpen(false)}>
          <PinSettingsForm
            currentPin={ownerPin}
            onSetPin={async (pin) => { await setNewPin(pin); setPinSettingsOpen(false); }}
            onRemovePin={async () => { await removePin(); setPinSettingsOpen(false); }}
            onClose={() => setPinSettingsOpen(false)}
          />
        </Modal>
      )}

      {confirmDialog && (
        <Modal title="請確認" onClose={() => setConfirmDialog(null)}>
          <div style={{ fontSize: 14, color: COLORS.ink, lineHeight: 1.6, marginBottom: 20 }}>{confirmDialog.message}</div>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
            <Btn variant="ghost" onClick={() => setConfirmDialog(null)}>取消</Btn>
            <Btn variant="danger" onClick={() => { confirmDialog.onYes(); setConfirmDialog(null); }}>確定</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
